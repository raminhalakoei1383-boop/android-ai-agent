name: Build Android APK v1.5

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate v1.5 Android Project
        run: |
          python3 - << 'PYEOF'
          import os, textwrap
          def w(p, c):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(c).lstrip("\n"))

          w("AndroidAIAgentApp/settings.gradle.kts", r"""
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AndroidAIAgent"
          include(":app")
          """)

          w("AndroidAIAgentApp/build.gradle.kts", r"""
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          """)

          w("AndroidAIAgentApp/app/build.gradle.kts", r"""
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aiagent.android"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aiagent.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 6
                  versionName = "1.5"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = "agentpassword123"
                      keyAlias = "agentkey"
                      keyPassword = "agentpassword123"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          """)

          w("AndroidAIAgentApp/app/src/main/AndroidManifest.xml", r"""
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:allowBackup="true"
                  android:label="Android AI Agent"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".AgentAccessibilityService"
                      android:exported="true"
                      android:label="Android AI Agent Service"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          """)

          w("AndroidAIAgentApp/app/src/main/res/xml/accessibility_service_config.xml", r"""
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows|flagReportViewIds|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="80" />
          """)

          w("AndroidAIAgentApp/app/src/main/java/com/aiagent/android/AgentBus.kt", r"""
          package com.aiagent.android

          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONArray
          import org.json.JSONObject

          data class ChatMsg(val id: Long, val role: String, val text: String)

          object AgentBus {
              private const val PREFS = "ai_agent_prefs"
              private const val KEY_MSGS = "chat_messages"
              val messages = mutableListOf<ChatMsg>()
              val taskQueue = ArrayDeque<String>()
              @Volatile var isRunning = false
              @Volatile var stopRequested = false
              var onUpdate: (() -> Unit)? = null
              private val mainHandler = Handler(Looper.getMainLooper())

              fun load(ctx: Context) {
                  if (messages.isNotEmpty()) return
                  val raw = ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).getString(KEY_MSGS, "[]") ?: "[]"
                  try {
                      val arr = JSONArray(raw)
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          messages.add(ChatMsg(o.getLong("id"), o.getString("role"), o.getString("text")))
                      }
                  } catch (_: Exception) {}
              }

              private fun save(ctx: Context) {
                  val arr = JSONArray()
                  synchronized(messages) {
                      for (m in messages) {
                          arr.put(JSONObject().put("id", m.id).put("role", m.role).put("text", m.text))
                      }
                  }
                  ctx.getSharedPreferences(PREFS, Context.MODE_PRIVATE).edit().putString(KEY_MSGS, arr.toString()).apply()
              }

              fun addMessage(ctx: Context, role: String, text: String) {
                  synchronized(messages) {
                      messages.add(ChatMsg(System.nanoTime(), role, text))
                  }
                  save(ctx)
                  notifyUI()
              }

              fun deleteMessage(ctx: Context, id: Long) {
                  synchronized(messages) {
                      messages.removeAll { it.id == id }
                  }
                  save(ctx)
                  notifyUI()
              }

              fun clearAll(ctx: Context) {
                  synchronized(messages) { messages.clear() }
                  save(ctx)
                  notifyUI()
              }

              fun notifyUI() {
                  mainHandler.post { onUpdate?.invoke() }
              }
          }
          """)

          w("AndroidAIAgentApp/app/src/main/java/com/aiagent/android/MainActivity.kt", r"""
          package com.aiagent.android

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var chatContainer: LinearLayout
              private lateinit var scrollView: ScrollView
              private lateinit var inputBox: EditText
              private lateinit var apiKeyBox: EditText
              private lateinit var modelBox: EditText
              private lateinit var settingsPanel: LinearLayout
              private lateinit var stopBtn: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  AgentBus.load(this)
                  val prefs = getSharedPreferences("ai_agent_prefs", Context.MODE_PRIVATE)
                  val savedKey = prefs.getString("api_key", "") ?: ""
                  val savedModel = prefs.getString("model", "gemini-3.5-flash-lite") ?: "gemini-3.5-flash-lite"

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#F5F7FA"))
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#1A73E8"))
                      setPadding(24, 32, 24, 24)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  val title = TextView(this).apply {
                      text = "دستیار هوشمند v1.5"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val btnSettings = makePillBtn("تنظیمات", "#1558B0") {
                      settingsPanel.visibility = if (settingsPanel.visibility == View.VISIBLE) View.GONE else View.VISIBLE
                  }
                  val btnClear = makePillBtn("حذف چت", "#D93025") {
                      AgentBus.clearAll(this)
                  }
                  header.addView(title)
                  header.addView(btnSettings)
                  header.addView(btnClear)
                  root.addView(header)

                  settingsPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.WHITE)
                      setPadding(24, 16, 24, 16)
                      visibility = if (savedKey.isBlank()) View.VISIBLE else View.GONE
                  }
                  apiKeyBox = EditText(this).apply {
                      hint = "کلید Gemini API را وارد کنید"
                      setText(savedKey)
                      textSize = 14f
                  }
                  modelBox = EditText(this).apply {
                      hint = "نام مدل (پیش‌فرض: gemini-3.5-flash-lite)"
                      setText(savedModel)
                      textSize = 14f
                  }
                  val btnAcc = makePillBtn("فعال‌سازی سرویس دسترسی (Accessibility)", "#0F9D58") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  val btnSave = makePillBtn("ذخیره تنظیمات", "#1A73E8") {
                      prefs.edit()
                          .putString("api_key", apiKeyBox.text.toString().trim())
                          .putString("model", modelBox.text.toString().trim().ifEmpty { "gemini-3.5-flash-lite" })
                          .apply()
                      settingsPanel.visibility = View.GONE
                      Toast.makeText(this, "ذخیره شد", Toast.LENGTH_SHORT).show()
                  }
                  settingsPanel.addView(apiKeyBox)
                  settingsPanel.addView(modelBox)
                  val rowBtns = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  rowBtns.addView(btnAcc)
                  rowBtns.addView(btnSave)
                  settingsPanel.addView(rowBtns)
                  root.addView(settingsPanel)

                  scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  }
                  chatContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(16, 16, 16, 16)
                  }
                  scrollView.addView(chatContainer)
                  root.addView(scrollView)

                  val bottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.WHITE)
                      setPadding(16, 12, 16, 16)
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  inputBox = EditText(this).apply {
                      hint = "دستور خود را بنویسید..."
                      textSize = 15f
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  stopBtn = makePillBtn("توقف", "#D93025") {
                      AgentBus.stopRequested = true
                      synchronized(AgentBus.taskQueue) { AgentBus.taskQueue.clear() }
                      AgentBus.addMessage(this, "agent", "درخواست توقف ثبت شد.")
                  }
                  stopBtn.visibility = View.GONE
                  val sendBtn = makePillBtn("ارسال", "#1A73E8") {
                      val task = inputBox.text.toString().trim()
                      val key = apiKeyBox.text.toString().trim()
                      val model = modelBox.text.toString().trim().ifEmpty { "gemini-3.5-flash-lite" }
                      if (task.isEmpty()) return@makePillBtn
                      if (key.isEmpty()) {
                          settingsPanel.visibility = View.VISIBLE
                          Toast.makeText(this, "ابتدا کلید Gemini API را وارد کنید", Toast.LENGTH_SHORT).show()
                          return@makePillBtn
                      }
                      prefs.edit().putString("api_key", key).putString("model", model).apply()
                      inputBox.setText("")
                      AgentBus.addMessage(this, "user", task)
                      val svc = AgentAccessibilityService.instance
                      if (svc == null) {
                          AgentBus.addMessage(this, "agent", "سرویس دسترسی (Accessibility) خاموش است. از بخش تنظیمات آن را روشن کنید.")
                          return@makePillBtn
                      }
                      synchronized(AgentBus.taskQueue) { AgentBus.taskQueue.addLast(task) }
                      if (AgentBus.isRunning) {
                          AgentBus.addMessage(this, "agent", "دستور در صف قرار گرفت و بلافاصله پس از کار فعلی اجرا می‌شود.")
                      } else {
                          svc.startQueue(applicationContext, key, model)
                      }
                  }
                  bottomBar.addView(inputBox)
                  bottomBar.addView(stopBtn)
                  bottomBar.addView(sendBtn)
                  root.addView(bottomBar)

                  setContentView(root)
                  AgentBus.onUpdate = { renderChat() }
                  renderChat()
              }

              private fun makePillBtn(label: String, colorHex: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      text = label
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      isAllCaps = false
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor(colorHex))
                          cornerRadius = 24f
                      }
                      setPadding(20, 8, 20, 8)
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.WRAP_CONTENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(8, 4, 8, 4) }
                      setOnClickListener { onClick() }
                  }
              }

              private fun renderChat() {
                  chatContainer.removeAllViews()
                  stopBtn.visibility = if (AgentBus.isRunning) View.VISIBLE else View.GONE
                  val copy = synchronized(AgentBus.messages) { AgentBus.messages.toList() }
                  for (m in copy) {
                      val isUser = m.role == "user"
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = if (isUser) Gravity.START else Gravity.END
                          setPadding(8, 6, 8, 6)
                      }
                      val bubble = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(24, 16, 16, 16)
                          background = GradientDrawable().apply {
                              setColor(Color.parseColor(if (isUser) "#1A73E8" else "#FFFFFF"))
                              cornerRadius = 28f
                              if (!isUser) setStroke(2, Color.parseColor("#DADCE0"))
                          }
                      }
                      val tv = TextView(this).apply {
                          text = m.text
                          setTextColor(if (isUser) Color.WHITE else Color.parseColor("#202124"))
                          textSize = 14f
                          maxWidth = (resources.displayMetrics.widthPixels * 0.72).toInt()
                      }
                      val del = TextView(this).apply {
                          text = " ✕ "
                          setTextColor(if (isUser) Color.parseColor("#D2E3FC") else Color.parseColor("#D93025"))
                          textSize = 14f
                          setPadding(12, 0, 4, 0)
                          setOnClickListener { AgentBus.deleteMessage(this@MainActivity, m.id) }
                      }
                      bubble.addView(tv)
                      bubble.addView(del)
                      row.addView(bubble)
                      chatContainer.addView(row)
                  }
                  scrollView.post { scrollView.fullScroll(View.FOCUS_DOWN) }
              }

              override fun onDestroy() {
                  AgentBus.onUpdate = null
                  super.onDestroy()
              }
          }
          """)

          w("AndroidAIAgentApp/app/src/main/java/com/aiagent/android/AgentAccessibilityService.kt", r"""
          package com.aiagent.android

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.util.Base64
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          class AgentAccessibilityService : AccessibilityService() {
              companion object {
                  @Volatile var instance: AgentAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() {
                  if (instance == this) instance = null
                  super.onDestroy()
              }

              fun startQueue(ctx: Context, apiKey: String, model: String) {
                  if (AgentBus.isRunning) return
                  AgentBus.isRunning = true
                  AgentBus.stopRequested = false
                  AgentBus.notifyUI()
                  Thread {
                      try {
                          while (!AgentBus.stopRequested) {
                              val task = synchronized(AgentBus.taskQueue) {
                                  if (AgentBus.taskQueue.isEmpty()) null else AgentBus.taskQueue.removeFirst()
                              } ?: break
                              runSingleTask(ctx, apiKey, model, task)
                          }
                      } finally {
                          AgentBus.isRunning = false
                          AgentBus.notifyUI()
                      }
                  }.start()
              }

              private fun runSingleTask(ctx: Context, apiKey: String, model: String, task: String) {
                  AgentBus.addMessage(ctx, "agent", "⚡ شروع اجرای سریع و کامل: $task")
                  val history = mutableListOf<String>()
                  var lastSig = ""
                  var stuckCount = 0
                  var forceVisionNext = false

                  for (step in 1..40) {
                      if (AgentBus.stopRequested) {
                          AgentBus.addMessage(ctx, "agent", "اجرا متوقف شد.")
                          return
                      }
                      val (pkgName, uiDump, nodeCount) = dumpUI()
                      val sig = "$pkgName|${uiDump.take(350)}"
                      if (sig == lastSig) stuckCount++ else { stuckCount = 0; lastSig = sig }

                      val needVision = forceVisionNext || stuckCount >= 1 || nodeCount < 6
                      forceVisionNext = false
                      val screenshotB64 = if (needVision) captureScreenshotBase64() else null
                      val dm = resources.displayMetrics

                      val prompt = buildString {
                          append("You are a fast, precise Android automation agent. You MUST complete EVERY SINGLE PART of the user's command accurately before returning action=done.\n")
                          append("Screen: ${dm.widthPixels}x${dm.heightPixels} | ActiveApp: $pkgName\n")
                          append("User Command: $task\n")
                          append("Step: $step/40\n")
                          if (history.isNotEmpty()) append("Done so far:\n${history.takeLast(10).joinToString("\n")}\n")
                          if (stuckCount >= 1) append("WARNING: Screen unchanged ($stuckCount). Use visual coordinates, scroll, or a different control.\n")
                          append("UI Elements ($nodeCount):\n$uiDump\n")
                          append("Rules:\n")
                          append("1. Never return done until ALL steps in User Command are visually verified complete.\n")
                          append("2. For speed, you may batch up to 2 actions in \"actions\" (e.g. tap input then type with enter=true).\n")
                          append("3. If UI text is unclear or missing icons, return action=\"inspect_screen\" to request a screenshot.\n")
                          append("Respond ONLY with compact JSON:\n")
                          append("{\"thought\":\"short Persian status\",\"remaining\":\"what is still left or none\",\"action\":\"open_app|tap|click_text|long_click|type|scroll|back|home|wait|inspect_screen|done\",\"x\":0,\"y\":0,\"text\":\"\",\"app\":\"\",\"direction\":\"down\",\"enter\":true,\"actions\":[],\"message\":\"final Persian summary\"}")
                      }

                      val raw = callGeminiWithRetry(ctx, apiKey, model, prompt, screenshotB64)
                      if (raw == null) {
                          AgentBus.addMessage(ctx, "agent", "خطا در ارتباط با سرور پس از چند تلاش مجدد. اتصال اینترنت/VPN را بررسی کنید.")
                          return
                      }
                      val json = extractJson(raw)
                      if (json == null) {
                          history.add("Step $step: invalid JSON")
                          continue
                      }

                      val thought = json.optString("thought", "")
                      val remaining = json.optString("remaining", "").trim()
                      val action = json.optString("action", "")
                      if (thought.isNotBlank()) AgentBus.addMessage(ctx, "agent", "قدم $step: $thought")

                      if (action == "inspect_screen") {
                          forceVisionNext = true
                          history.add("Step $step: requested screenshot")
                          continue
                      }

                      if (action == "done") {
                          val remLow = remaining.lowercase()
                          val isStillLeft = remLow.isNotEmpty() && remLow !in setOf("none", "null", "nothing", "هیچ", "ندارد", "تمام", "0", "-")
                          if (isStillLeft) {
                              history.add("Step $step: blocked early done; remaining=$remaining")
                              AgentBus.addMessage(ctx, "agent", "ادامه برای تکمیل بخش باقی‌مانده: $remaining")
                              continue
                          }
                          val msg = json.optString("message", "همه مراحل دستور با موفقیت انجام شد.")
                          AgentBus.addMessage(ctx, "agent", "✅ $msg")
                          return
                      }

                      val batch = json.optJSONArray("actions")
                      if (batch != null && batch.length() > 0) {
                          val limit = minOf(batch.length(), 3)
                          for (i in 0 until limit) {
                              if (AgentBus.stopRequested) break
                              val sub = batch.optJSONObject(i) ?: continue
                              val subAct = sub.optString("action", "")
                              if (subAct == "done") continue
                              val delayMs = executeSingleAction(ctx, sub)
                              history.add("Step $step.${i + 1}: $subAct (${sub.optString("text")}${sub.optString("app")})")
                              Thread.sleep(delayMs)
                          }
                      } else {
                          val delayMs = executeSingleAction(ctx, json)
                          history.add("Step $step: $action (${json.optString("text")}${json.optString("app")})")
                          Thread.sleep(delayMs)
                      }
                  }
                  AgentBus.addMessage(ctx, "agent", "به سقف ۴۰ مرحله رسیدم. اگر بخش دیگری باقی مانده دستور ادامه را بفرستید.")
              }

              private fun executeSingleAction(ctx: Context, json: JSONObject): Long {
                  return when (json.optString("action", "")) {
                      "open_app" -> { openAppByName(ctx, json.optString("app", "")); 1150L }
                      "tap" -> { performTap(json.optInt("x", 0).toFloat(), json.optInt("y", 0).toFloat(), 80L); 650L }
                      "long_click" -> { performTap(json.optInt("x", 0).toFloat(), json.optInt("y", 0).toFloat(), 650L); 700L }
                      "click_text" -> { clickByText(json.optString("text", "")); 650L }
                      "type" -> {
                          val enter = json.optBoolean("enter", true)
                          typeText(ctx, json.optString("text", ""), json.optInt("x", -1), json.optInt("y", -1), enter)
                          if (enter) 900L else 450L
                      }
                      "scroll" -> { performScroll(json.optString("direction", "down")); 650L }
                      "back" -> { performGlobalAction(GLOBAL_ACTION_BACK); 600L }
                      "home" -> { performGlobalAction(GLOBAL_ACTION_HOME); 700L }
                      "wait" -> 1500L
                      else -> 400L
                  }
              }

              private fun callGeminiWithRetry(ctx: Context, apiKey: String, model: String, prompt: String, b64Img: String?): String? {
                  val delays = longArrayOf(1500, 3000, 6000, 10000)
                  for (attempt in 0..delays.size) {
                      if (AgentBus.stopRequested) return null
                      try {
                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$apiKey")
                          val conn = (url.openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              connectTimeout = 20000
                              readTimeout = 35000
                              doOutput = true
                              setRequestProperty("Content-Type", "application/json; charset=utf-8")
                          }
                          val parts = JSONArray().put(JSONObject().put("text", prompt))
                          if (!b64Img.isNullOrEmpty()) {
                              parts.put(JSONObject().put("inline_data", JSONObject().put("mime_type", "image/jpeg").put("data", b64Img)))
                          }
                          val body = JSONObject()
                              .put("contents", JSONArray().put(JSONObject().put("parts", parts)))
                              .put("generationConfig", JSONObject()
                                  .put("responseMimeType", "application/json")
                                  .put("temperature", 0.1)
                                  .put("maxOutputTokens", 350))
                          conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                          val code = conn.responseCode
                          if (code in 200..299) {
                              val resp = conn.inputStream.bufferedReader().readText()
                              val obj = JSONObject(resp)
                              return obj.getJSONArray("candidates").getJSONObject(0)
                                  .getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          }
                          if (code == 429 || code == 503 || code >= 500) {
                              if (attempt < delays.size) {
                                  AgentBus.addMessage(ctx, "agent", "سرور شلوغ است (کد $code)، تلاش مجدد...")
                                  Thread.sleep(delays[attempt])
                                  continue
                              }
                          }
                          return null
                      } catch (e: Exception) {
                          if (attempt < delays.size) {
                              AgentBus.addMessage(ctx, "agent", "تأخیر شبکه، تلاش مجدد...")
                              Thread.sleep(delays[attempt])
                          } else return null
                      }
                  }
                  return null
              }

              private fun extractJson(s: String): JSONObject? {
                  return try {
                      val start = s.indexOf('{')
                      val end = s.lastIndexOf('}')
                      if (start >= 0 && end > start) JSONObject(s.substring(start, end + 1)) else null
                  } catch (_: Exception) { null }
              }

              private fun dumpUI(): Triple<String, String, Int> {
                  val root = rootInActiveWindow ?: return Triple("unknown", "(no window)", 0)
                  val pkg = root.packageName?.toString() ?: "unknown"
                  val sb = StringBuilder()
                  var count = 0
                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null || count >= 110) return
                      val t = n.text?.toString()?.trim().orEmpty()
                      val d = n.contentDescription?.toString()?.trim().orEmpty()
                      if (t.isNotEmpty() || d.isNotEmpty() || n.isClickable || n.isEditable) {
                          val r = Rect()
                          n.getBoundsInScreen(r)
                          if (r.width() > 0 && r.height() > 0) {
                              count++
                              sb.append("[$count] ")
                              if (t.isNotEmpty()) sb.append("t=\"${t.take(45)}\" ")
                              if (d.isNotEmpty()) sb.append("d=\"${d.take(35)}\" ")
                              if (n.isEditable) sb.append("EDIT ")
                              if (n.isClickable) sb.append("CLK ")
                              if (n.isSelected || n.isChecked) sb.append("ON ")
                              sb.append("(${r.centerX()},${r.centerY()})\n")
                          }
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i))
                  }
                  walk(root)
                  return Triple(pkg, sb.toString(), count)
              }

              private fun captureScreenshotBase64(): String? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  var result: String? = null
                  val latch = CountDownLatch(1)
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                          override fun onSuccess(sr: ScreenshotResult) {
                              try {
                                  val bmp = Bitmap.wrapHardwareBuffer(sr.hardwareBuffer, sr.colorSpace)
                                  if (bmp != null) {
                                      val sw = bmp.copy(Bitmap.Config.ARGB_8888, false)
                                      val scale = minOf(1f, 540f / maxOf(sw.width, sw.height))
                                      val resized = Bitmap.createScaledBitmap(sw, (sw.width * scale).toInt(), (sw.height * scale).toInt(), true)
                                      val out = ByteArrayOutputStream()
                                      resized.compress(Bitmap.CompressFormat.JPEG, 45, out)
                                      result = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
                                      resized.recycle(); sw.recycle(); bmp.recycle()
                                  }
                                  sr.hardwareBuffer.close()
                              } catch (_: Exception) {}
                              latch.countDown()
                          }
                          override fun onFailure(errorCode: Int) { latch.countDown() }
                      })
                      latch.await(2, TimeUnit.SECONDS)
                  } catch (_: Exception) {}
                  return result
              }

              private fun norm(s: String) = s.lowercase().replace('ي', 'ی').replace('ك', 'ک').replace("‌", "").replace(" ", "")

              private fun openAppByName(ctx: Context, appName: String) {
                  val target = norm(appName)
                  val pm = ctx.packageManager
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val apps = pm.queryIntentActivities(intent, 0)
                  val match = apps.firstOrNull {
                      val lbl = norm(it.loadLabel(pm).toString())
                      val pkg = it.activityInfo.packageName.lowercase()
                      lbl == target || lbl.contains(target) || target.contains(lbl) || pkg.contains(target)
                  }
                  if (match != null) {
                      val launch = pm.getLaunchIntentForPackage(match.activityInfo.packageName)
                      launch?.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      if (launch != null) ctx.startActivity(launch)
                  }
              }

              private fun performTap(x: Float, y: Float, dur: Long) {
                  val path = Path().apply { moveTo(x, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, dur)).build()
                  dispatchGesture(gesture, null, null)
              }

              private fun clickByText(query: String) {
                  val root = rootInActiveWindow ?: return
                  val q = norm(query)
                  fun find(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                      if (n == null) return null
                      val t = norm(n.text?.toString().orEmpty())
                      val d = norm(n.contentDescription?.toString().orEmpty())
                      if ((t.isNotEmpty() && t.contains(q)) || (d.isNotEmpty() && d.contains(q))) return n
                      for (i in 0 until n.childCount) {
                          val f = find(n.getChild(i))
                          if (f != null) return f
                      }
                      return null
                  }
                  val node = find(root) ?: return
                  var cur: AccessibilityNodeInfo? = node
                  while (cur != null) {
                      if (cur.isClickable) { cur.performAction(AccessibilityNodeInfo.ACTION_CLICK); return }
                      cur = cur.parent
                  }
                  val r = Rect(); node.getBoundsInScreen(r)
                  performTap(r.centerX().toFloat(), r.centerY().toFloat(), 80L)
              }

              private fun typeText(ctx: Context, text: String, x: Int, y: Int, enter: Boolean) {
                  if (x > 0 && y > 0) { performTap(x.toFloat(), y.toFloat(), 70L); Thread.sleep(280) }
                  val root = rootInActiveWindow ?: return
                  fun findEdit(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                      if (n == null) return null
                      if (n.isFocused && n.isEditable) return n
                      for (i in 0 until n.childCount) { val f = findEdit(n.getChild(i)); if (f != null) return f }
                      return null
                  }
                  fun findAnyEdit(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                      if (n == null) return null
                      if (n.isEditable) return n
                      for (i in 0 until n.childCount) { val f = findAnyEdit(n.getChild(i)); if (f != null) return f }
                      return null
                  }
                  val edit = findEdit(root) ?: findAnyEdit(root) ?: return
                  val args = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text) }
                  if (!edit.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                      val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("agent", text))
                      edit.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                  }
                  if (enter && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      Thread.sleep(200)
                      edit.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                  }
              }

              private fun performScroll(dir: String) {
                  val dm = resources.displayMetrics
                  val cx = dm.widthPixels / 2f
                  val y1 = if (dir == "up") dm.heightPixels * 0.3f else dm.heightPixels * 0.75f
                  val y2 = if (dir == "up") dm.heightPixels * 0.75f else dm.heightPixels * 0.3f
                  val path = Path().apply { moveTo(cx, y1); lineTo(cx, y2) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 280)).build()
                  dispatchGesture(gesture, null, null)
              }
          }
