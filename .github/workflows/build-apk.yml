name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Signing Key
        run: |
          keytool -genkeypair -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias agentkey -storepass android123 -keypass android123 -dname "CN=AndroidAIAgent,O=Personal,C=IR"
      - name: Generate Android AI Agent Project v1.3
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          files = {
          "settings.gradle.kts": '''pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "AndroidAIAgentApp"
          include(":app")
          ''',
          "build.gradle.kts": '''plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          ''',
          "gradle.properties": "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\nandroid.useAndroidX=true\n",
          "app/build.gradle.kts": '''plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.aiagent.android"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.aiagent.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "1.3"
              }
              signingConfigs {
                  create("release") {
                      storeFile = file("../release.jks")
                      storePassword = "android123"
                      keyAlias = "agentkey"
                      keyPassword = "android123"
                  }
              }
              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          ''',
          "app/src/main/AndroidManifest.xml": '''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application android:icon="@android:drawable/sym_def_app_icon" android:label="Android AI Agent" android:supportsRtl="true" android:theme="@android:style/Theme.Material.Light">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".AgentAccessibilityService" android:exported="false" android:label="Android AI Agent Service" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                      <meta-data android:name="android.accessibilityservice" android:resource="@xml/agent_accessibility_config" />
                  </service>
              </application>
          </manifest>
          ''',
          "app/src/main/res/xml/agent_accessibility_config.xml": '''<?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagRetrieveInteractiveWindows|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:notificationTimeout="150" />
          ''',
          "app/src/main/java/com/aiagent/android/AgentAccessibilityService.kt": r'''package com.aiagent.android
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.util.Base64
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          data class ScreenElement(val id: Int, val text: String, val desc: String, val viewId: String, val cls: String, val clickable: Boolean, val editable: Boolean, val scrollable: Boolean, val bounds: Rect, val node: AccessibilityNodeInfo) {
              fun toLine(): String = "[$id] text=\"$text\" desc=\"$desc\" id=${viewId.substringAfterLast('/')} (${if (clickable) "click," else ""}${if (editable) "edit," else ""}${if (scrollable) "scroll" else ""}) @(${bounds.centerX()},${bounds.centerY()})"
          }

          class AgentAccessibilityService : AccessibilityService() {
              companion object { @Volatile var instance: AgentAccessibilityService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
              override fun onDestroy() { super.onDestroy(); instance = null }
              fun screenSize(): Pair<Int, Int> = resources.displayMetrics.widthPixels to resources.displayMetrics.heightPixels
              fun currentPackage(): String = rootInActiveWindow?.packageName?.toString().orEmpty()

              private fun norm(s: String): String = s.lowercase()
                  .replace('\u064a', '\u06cc').replace('\u0643', '\u06a9')
                  .replace("\u200c", "").replace(" ", "")

              fun captureScreenshotBase64(): String? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  val latch = CountDownLatch(1)
                  var outB64: String? = null
                  try {
                      takeScreenshot(Display.DEFAULT_DISPLAY, mainExecutor, object : TakeScreenshotCallback {
                          override fun onSuccess(screenshot: ScreenshotResult) {
                              try {
                                  val buf = screenshot.hardwareBuffer
                                  val hw = Bitmap.wrapHardwareBuffer(buf, screenshot.colorSpace)
                                  buf.close()
                                  if (hw != null) {
                                      val sw = hw.copy(Bitmap.Config.ARGB_8888, false)
                                      hw.recycle()
                                      val targetW = 540
                                      val scaled = if (sw.width > targetW) {
                                          val targetH = (sw.height * targetW.toFloat() / sw.width).toInt().coerceAtLeast(1)
                                          Bitmap.createScaledBitmap(sw, targetW, targetH, true).also { sw.recycle() }
                                      } else sw
                                      val baos = ByteArrayOutputStream()
                                      scaled.compress(Bitmap.CompressFormat.JPEG, 65, baos)
                                      scaled.recycle()
                                      outB64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP)
                                  }
                              } catch (_: Exception) {}
                              latch.countDown()
                          }
                          override fun onFailure(errorCode: Int) { latch.countDown() }
                      })
                      latch.await(4, TimeUnit.SECONDS)
                  } catch (_: Exception) {}
                  return outB64
              }

              fun captureElements(limit: Int = 110): List<ScreenElement> {
                  val root = rootInActiveWindow ?: return emptyList()
                  val list = mutableListOf<ScreenElement>()
                  var id = 1
                  fun walk(n: AccessibilityNodeInfo?) {
                      if (n == null || list.size >= limit) return
                      val t = n.text?.toString()?.trim().orEmpty().take(80)
                      val d = n.contentDescription?.toString()?.trim().orEmpty().take(80)
                      val r = Rect(); n.getBoundsInScreen(r)
                      if (r.width() > 0 && r.height() > 0 && (t.isNotEmpty() || d.isNotEmpty() || n.isClickable || n.isEditable || n.isScrollable)) {
                          list.add(ScreenElement(id++, t, d, n.viewIdResourceName.orEmpty(), n.className?.toString().orEmpty(), n.isClickable, n.isEditable, n.isScrollable, r, n))
                      }
                      for (i in 0 until n.childCount) walk(n.getChild(i))
                  }
                  walk(root)
                  return list
              }

              fun clickEl(el: ScreenElement): String {
                  var cur: AccessibilityNodeInfo? = el.node
                  repeat(4) {
                      if (cur != null && cur!!.isClickable && cur!!.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                          return "Clicked [${el.id}] (${el.text.ifBlank { el.desc }})"
                      }
                      cur = cur?.parent
                  }
                  return tap(el.bounds.centerX().toFloat(), el.bounds.centerY().toFloat())
              }

              fun tap(x: Float, y: Float, durationMs: Long = 80L): String {
                  val p = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, durationMs)).build()
                  return if (dispatchGesture(g, null, null)) "Tapped (${x.toInt()},${y.toInt()})" else "Tap failed"
              }

              fun typeText(el: ScreenElement?, txt: String): String {
                  if (el != null) {
                      tap(el.bounds.centerX().toFloat(), el.bounds.centerY().toFloat())
                      Thread.sleep(300)
                  }
                  val target = el?.node ?: rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return "No input field"
                  target.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val b = Bundle().apply { putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, txt) }
                  if (target.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)) return "Typed: $txt"
                  val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("agent", txt))
                  if (target.performAction(AccessibilityNodeInfo.ACTION_PASTE)) return "Pasted: $txt"
                  return "Type failed"
              }

              fun submitInput(): String {
                  val target = rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return "No focused field"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      if (target.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)) return "Pressed IME Enter"
                  }
                  return "IME Enter not supported on field"
              }

              fun swipe(dir: String): String {
                  val (w, h) = screenSize(); val cx = w / 2f; val cy = h / 2f
                  val pts = when (dir.lowercase()) {
                      "up" -> floatArrayOf(cx, h * 0.78f, cx, h * 0.25f)
                      "down" -> floatArrayOf(cx, h * 0.25f, cx, h * 0.78f)
                      "left" -> floatArrayOf(w * 0.85f, cy, w * 0.15f, cy)
                      else -> floatArrayOf(w * 0.15f, cy, w * 0.85f, cy)
                  }
                  val p = Path().apply { moveTo(pts[0], pts[1]); lineTo(pts[2], pts[3]) }
                  val g = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(p, 0, 320)).build()
                  return if (dispatchGesture(g, null, null)) "Swiped $dir" else "Swipe failed"
              }

              fun globalAct(name: String): String {
                  val c = when (name.uppercase()) {
                      "BACK" -> GLOBAL_ACTION_BACK; "HOME" -> GLOBAL_ACTION_HOME; "RECENTS" -> GLOBAL_ACTION_RECENTS
                      "NOTIFICATIONS" -> GLOBAL_ACTION_NOTIFICATIONS; else -> GLOBAL_ACTION_QUICK_SETTINGS
                  }
                  return if (performGlobalAction(c)) "Global $name" else "Global failed"
              }

              private fun allLauncherApps(): List<Pair<String, String>> {
                  val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  return packageManager.queryIntentActivities(intent, 0)
                      .map { ri -> ri.loadLabel(packageManager).toString() to ri.activityInfo.packageName }
                      .distinctBy { it.second }
              }

              fun openApp(nameOrPkg: String): String {
                  val raw = nameOrPkg.trim()
                  packageManager.getLaunchIntentForPackage(raw)?.let {
                      it.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(it); return "Opened $raw"
                  }
                  val q = norm(raw)
                  val match = allLauncherApps().firstOrNull { (label, pkg) ->
                      norm(label).contains(q) || norm(pkg).contains(q)
                  } ?: return "App not found: $raw"
                  val intent = packageManager.getLaunchIntentForPackage(match.second) ?: return "Cannot launch ${match.second}"
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); startActivity(intent)
                  return "Opened ${match.first} (${match.second})"
              }

              fun listApps(q: String?): String {
                  val qn = norm(q.orEmpty())
                  val apps = allLauncherApps()
                      .filter { (label, pkg) -> qn.isBlank() || norm(label).contains(qn) || norm(pkg).contains(qn) }
                      .map { (label, pkg) -> "$label ($pkg)" }
                      .take(120)
                  return if (apps.isEmpty()) "No apps matched '$q'" else apps.joinToString(", ")
              }
          }
          ''',
          "app/src/main/java/com/aiagent/android/MainActivity.kt": r'''package com.aiagent.android
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.View
          import android.widget.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.atomic.AtomicBoolean

          class MainActivity : Activity() {
              private lateinit var tvStatus: TextView
              private lateinit var etKey: EditText
              private lateinit var etModel: EditText
              private lateinit var etTask: EditText
              private lateinit var btnRun: Button
              private lateinit var btnStop: Button
              private lateinit var tvLog: TextView
              private lateinit var scroll: ScrollView
              private val running = AtomicBoolean(false)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val prefs = getSharedPreferences("agent_prefs", MODE_PRIVATE)
                  val root = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(36, 36, 36, 36); layoutDirection = View.LAYOUT_DIRECTION_RTL }
                  val title = TextView(this).apply { text = "ایجنت هوشمند اندروید v1.3 (بینایی زنده)"; textSize = 19f }
                  tvStatus = TextView(this).apply { textSize = 14f }
                  val btnAcc = Button(this).apply { text = "فعال‌سازی سرویس دسترسی (Accessibility)"; setOnClickListener { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) } }
                  etKey = EditText(this).apply { hint = "کلید Gemini API"; inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD; setText(prefs.getString("key", "")) }
                  etModel = EditText(this).apply { hint = "مدل (پیشنهادی: gemini-3.5-flash)"; setText(prefs.getString("model", "gemini-3.5-flash")) }
                  etTask = EditText(this).apply { hint = "تسک دقیق خود را بنویسید..."; minLines = 2 }
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  btnRun = Button(this).apply { text = "شروع تسک"; layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f) }
                  btnStop = Button(this).apply { text = "توقف"; isEnabled = false; layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f) }
                  row.addView(btnRun); row.addView(btnStop)
                  tvLog = TextView(this).apply { text = "آماده دریافت تسک..."; textSize = 12f }
                  scroll = ScrollView(this).apply { layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f); addView(tvLog) }
                  listOf(title, tvStatus, btnAcc, etKey, etModel, etTask, row, scroll).forEach { root.addView(it) }
                  setContentView(root)

                  btnRun.setOnClickListener {
                      val key = etKey.text.toString().trim()
                      val model = etModel.text.toString().trim().ifEmpty { "gemini-3.5-flash" }
                      val task = etTask.text.toString().trim()
                      if (key.isEmpty() || task.isEmpty()) { log("⚠️ کلید API و متن تسک را وارد کنید."); return@setOnClickListener }
                      if (AgentAccessibilityService.instance == null) { log("⚠️ ابتدا سرویس Accessibility را فعال کنید."); return@setOnClickListener }
                      prefs.edit().putString("key", key).putString("model", model).apply()
                      tvLog.text = ""; running.set(true); btnRun.isEnabled = false; btnStop.isEnabled = true
                      Thread { runLoop(key, model, task) }.start()
                  }
                  btnStop.setOnClickListener { running.set(false); log("⛔ متوقف شد.") }
              }

              override fun onResume() {
                  super.onResume()
                  tvStatus.text = if (AgentAccessibilityService.instance != null) "سرویس دسترسی: فعال ✅" else "سرویس دسترسی: غیرفعال ❌"
              }

              private fun log(msg: String) = runOnUiThread { tvLog.append("$msg\n"); scroll.post { scroll.fullScroll(View.FOCUS_DOWN) } }

              private fun confirm(msg: String): Boolean {
                  val latch = CountDownLatch(1); var ok = false
                  runOnUiThread {
                      AlertDialog.Builder(this).setTitle("تأیید اقدام حساس").setMessage(msg).setCancelable(false)
                          .setPositiveButton("اجرا کن") { _, _ -> ok = true; latch.countDown() }
                          .setNegativeButton("لغو") { _, _ -> ok = false; latch.countDown() }.show()
                  }
                  latch.await(); return ok
              }

              private fun callGemini(key: String, model: String, prompt: String, screenshotB64: String?): JSONObject {
                  val sys = """
                      You are an expert, deeply focused autonomous Android AI Agent.
                      You receive BOTH a live screenshot of the phone AND a numbered list of UI elements with exact pixel centers @(x,y).

                      CRITICAL DISCIPLINE:
                      1. Break the user's goal into every required sub-step and track what is Completed vs Remaining in `plan_progress`.
                      2. NEVER return action="done" early! Only return "done" when EVERY single part of the user's instruction is visibly verified complete on the current screen.
                      3. If a popup, ad, permission dialog, or splash screen blocks the screen, dismiss it first and continue the goal.
                      4. Prefer tapping by `element_id`. If an icon/button is visible in the screenshot but missing from the UI list, tap its exact pixel coordinates (x, y) within screen bounds (0..W, 0..H).
                      5. After typing into a search box, call `submit` or tap the search button/suggestion to actually execute the search.
                      6. `open_app` accepts Persian/English app names OR package names directly.
                      7. Set `requires_confirmation=true` BEFORE sending messages, payments/purchases, deletions, or calls.

                      Return ONLY valid JSON:
                      {"plan_progress":"Completed: ... | Remaining: ...","thought":"...","action":"tap|long_press|type_text|submit|swipe|global_action|open_app|list_apps|wait|done|fail","element_id":null,"x":null,"y":null,"text":null,"direction":null,"global_action":null,"requires_confirmation":false,"confirmation_message":null,"final_message":null}
                  """.trimIndent()

                  val userParts = JSONArray()
                  if (screenshotB64 != null) {
                      userParts.put(JSONObject().put("inlineData", JSONObject().put("mimeType", "image/jpeg").put("data", screenshotB64)))
                  }
                  userParts.put(JSONObject().put("text", prompt))

                  val body = JSONObject().apply {
                      put("systemInstruction", JSONObject().put("parts", JSONArray().put(JSONObject().put("text", sys))))
                      put("contents", JSONArray().put(JSONObject().put("role", "user").put("parts", userParts)))
                      put("generationConfig", JSONObject().put("temperature", 0.1).put("responseMimeType", "application/json"))
                  }
                  repeat(3) { attempt ->
                      val conn = (URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$key").openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"; doOutput = true; setRequestProperty("Content-Type", "application/json"); connectTimeout = 25000; readTimeout = 60000
                      }
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val raw = stream.bufferedReader().readText()
                      if (code == 429 && attempt < 2 && running.get()) {
                          log("⏳ محدودیت سرعت (429) — ۱۵ ثانیه صبر و تلاش مجدد...")
                          Thread.sleep(15000)
                      } else if (code !in 200..299) {
                          throw RuntimeException("API $code: ${raw.take(220)}")
                      } else {
                          val txt = JSONObject(raw).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                          return JSONObject(txt)
                      }
                  }
                  throw RuntimeException("API 429: سهمیه کلید API تمام شده است.")
              }

              private fun runLoop(key: String, model: String, task: String) {
                  try {
                      val svc = AgentAccessibilityService.instance ?: return
                      val history = mutableListOf<String>()
                      var lastSig = ""
                      var sameScreenCount = 0
                      log("🎯 شروع تسک ($model): $task")
                      for (step in 1..35) {
                          if (!running.get()) break
                          log("\n--- مرحله $step/35 ---")
                          val (w, h) = svc.screenSize()
                          val pkg = svc.currentPackage()
                          val els = svc.captureElements()
                          val shot = svc.captureScreenshotBase64()
                          val ui = els.joinToString("\n") { it.toLine() }
                          val sig = "$pkg:${ui.hashCode()}"
                          if (sig == lastSig) sameScreenCount++ else sameScreenCount = 0
                          lastSig = sig
                          val stuckHint = if (sameScreenCount >= 2) "\nWARNING: The screen has NOT changed for $sameScreenCount steps! Try a DIFFERENT element, tap exact screenshot coordinates, swipe/scroll, or press BACK." else ""
                          val prompt = "User Goal: $task\nCurrent App Package: $pkg\nScreen Size: ${w}x${h} pixels\nScreenshot Attached: ${shot != null}\nHistory:\n${history.takeLast(12).joinToString("\n")}$stuckHint\n\nVisible UI Elements:\n$ui"
                          val d = callGemini(key, model, prompt, shot)
                          val act = d.optString("action", "fail")
                          val progress = d.optString("plan_progress", "")
                          if (progress.isNotBlank()) log("📋 $progress")
                          log("🧠 ${d.optString("thought")}")
                          log("⚡ $act")
                          if (act == "done") { log("✅ ${d.optString("final_message", "تسک کامل شد.")}"); break }
                          if (act == "fail") { log("❌ ${d.optString("final_message", "انجام تسک ممکن نبود.")}"); break }
                          if (d.optBoolean("requires_confirmation", false) && !confirm(d.optString("confirmation_message", act))) { log("⛔ لغو شد."); break }
                          val byId = els.associateBy { it.id }
                          val obs = when (act) {
                              "tap" -> { val el = if (!d.isNull("element_id")) byId[d.optInt("element_id")] else null; if (el != null) svc.clickEl(el) else svc.tap(d.optInt("x").toFloat(), d.optInt("y").toFloat()) }
                              "long_press" -> { val el = if (!d.isNull("element_id")) byId[d.optInt("element_id")] else null; if (el != null) svc.tap(el.bounds.centerX().toFloat(), el.bounds.centerY().toFloat(), 800L) else svc.tap(d.optInt("x").toFloat(), d.optInt("y").toFloat(), 800L) }
                              "type_text" -> svc.typeText(if (!d.isNull("element_id")) byId[d.optInt("element_id")] else null, d.optString("text"))
                              "submit" -> svc.submitInput()
                              "swipe" -> svc.swipe(d.optString("direction", "up"))
                              "global_action" -> svc.globalAct(d.optString("global_action", "HOME"))
                              "open_app" -> svc.openApp(d.optString("text"))
                              "list_apps" -> svc.listApps(d.optString("text"))
                              "wait" -> { Thread.sleep(2500); "Waited 2.5s" }
                              else -> "Unknown"
                          }
                          log("📱 $obs"); history.add("Step $step: $act -> $obs")
                          Thread.sleep(if (act == "open_app") 3200 else 2500)
                      }
                  } catch (e: Exception) { log("❌ خطا: ${e.message}") }
                  finally { running.set(false); runOnUiThread { btnRun.isEnabled = true; btnStop.isEnabled = false } }
              }
          }
          '''
          }
          for k, v in files.items():
              p = Path(k); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(v.lstrip("\n"), encoding="utf-8")
          PYEOF
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidAIAgent-v1.3-APK
          path: app/build/outputs/apk/release/app-release.apk
