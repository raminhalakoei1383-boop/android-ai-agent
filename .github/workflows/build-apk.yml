name: Build Android APK v1.6

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android AI Agent v1.6 Project
        run: |
          python3 - << 'PYEOF'
          import os
          import textwrap

          ROOT = "AndroidAIAgentApp"
          PKG_DIR = os.path.join(ROOT, "app/src/main/java/com/aiagent/android")
          RES_DIR = os.path.join(ROOT, "app/src/main/res")

          def write(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip("\n"))

          write(os.path.join(ROOT, "settings.gradle.kts"), r'''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AndroidAIAgent"
          include(":app")
          ''')

          write(os.path.join(ROOT, "build.gradle.kts"), r'''
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ''')

          write(os.path.join(ROOT, "gradle.properties"), r'''
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          ''')

          write(os.path.join(ROOT, "app/build.gradle.kts"), r'''
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.aiagent.android"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.aiagent.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 16
                  versionName = "1.6"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = "agentpass123"
                      keyAlias = "agentkey"
                      keyPassword = "agentpass123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          ''')

          write(os.path.join(ROOT, "app/src/main/AndroidManifest.xml"), r'''
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Android AI Agent"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AgentAccessibilityService"
                      android:exported="false"
                      android:label="Android AI Agent Service"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          ''')

          write(os.path.join(RES_DIR, "xml/accessibility_service_config.xml"), r'''
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          ''')

          write(os.path.join(RES_DIR, "values/strings.xml"), r'''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Android AI Agent</string>
              <string name="accessibility_service_description">اجازه به ایجنت هوشمند برای خواندن صفحه، باز کردن برنامه‌ها، لمس دکمه‌ها و تایپ متن بر اساس دستورات شما.</string>
          </resources>
          ''')

          write(os.path.join(PKG_DIR, "AccessibilityHelper.kt"), r'''
          package com.aiagent.android

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.ComponentName
          import android.content.Context
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager

          enum class ServiceState {
              CONNECTED,
              ENABLED_BUT_SUSPENDED,
              DISABLED
          }

          object AccessibilityHelper {

              fun isConnected(): Boolean = AgentAccessibilityService.instance != null

              fun isEnabledInSettings(context: Context): Boolean {
                  if (isConnected()) return true

                  val myPkg = context.packageName
                  val myCls = AgentAccessibilityService::class.java.name
                  val myShortCls = AgentAccessibilityService::class.java.simpleName

                  try {
                      val am = context.getSystemService(Context.ACCESSIBILITY_SERVICE) as? AccessibilityManager
                      val enabledList = am?.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                      if (enabledList != null) {
                          for (info in enabledList) {
                              val si = info.resolveInfo?.serviceInfo ?: continue
                              if (si.packageName == myPkg &&
                                  (si.name == myCls || si.name.endsWith(".$myShortCls") || si.name == myShortCls)
                              ) {
                                  return true
                              }
                          }
                      }
                  } catch (_: Exception) {
                  }

                  try {
                      val raw = Settings.Secure.getString(
                          context.contentResolver,
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: ""
                      val expected = ComponentName(myPkg, myCls)
                      for (entry in raw.split(':')) {
                          val trimmed = entry.trim()
                          if (trimmed.isEmpty()) continue
                          val parsed = ComponentName.unflattenFromString(trimmed)
                          if (parsed != null && parsed == expected) return true
                          if (trimmed.contains(myPkg) && trimmed.contains(myShortCls)) return true
                      }
                  } catch (_: Exception) {
                  }

                  return false
              }

              fun getState(context: Context): ServiceState {
                  if (isConnected()) return ServiceState.CONNECTED
                  if (isEnabledInSettings(context)) return ServiceState.ENABLED_BUT_SUSPENDED
                  return ServiceState.DISABLED
              }
          }
          ''')

          write(os.path.join(PKG_DIR, "AgentAccessibilityService.kt"), r'''
          package com.aiagent.android

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.Rect
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Base64
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.suspendCancellableCoroutine
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.CopyOnWriteArraySet
          import kotlin.coroutines.resume

          data class UiElement(
              val index: Int,
              val text: String,
              val desc: String,
              val viewId: String,
              val className: String,
              val clickable: Boolean,
              val editable: Boolean,
              val scrollable: Boolean,
              val bounds: Rect
          )

          data class ScreenSnapshot(
              val foregroundPackage: String,
              val elements: List<UiElement>,
              val compactTree: String,
              val hash: Int
          )

          data class ActionResult(
              val success: Boolean,
              val message: String
          )

          data class AppEntry(
              val label: String,
              val packageName: String
          )

          class AgentAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: AgentAccessibilityService? = null
                      private set

                  @Volatile
                  var lastObservedPackage: String = ""
                      private set

                  private val listeners = CopyOnWriteArraySet<() -> Unit>()
                  private val mainHandler = Handler(Looper.getMainLooper())

                  fun addConnectionListener(listener: () -> Unit) {
                      listeners.add(listener)
                  }

                  fun removeConnectionListener(listener: () -> Unit) {
                      listeners.remove(listener)
                  }

                  private fun notifyListeners() {
                      mainHandler.post {
                          for (l in listeners) {
                              try { l() } catch (_: Exception) {}
                          }
                      }
                  }

                  private val APP_ALIASES: Map<String, List<String>> = mapOf(
                      "ترب" to listOf("ir.torob.android", "torob"),
                      "torob" to listOf("ir.torob.android"),
                      "دیجیکالا" to listOf("com.digikala", "digikala"),
                      "digikala" to listOf("com.digikala"),
                      "اسنپ" to listOf("cab.snapp.passenger", "snapp"),
                      "snapp" to listOf("cab.snapp.passenger"),
                      "اسنپفود" to listOf("com.zoodfood.android", "snappfood"),
                      "دیوار" to listOf("ir.divar", "divar"),
                      "divar" to listOf("ir.divar"),
                      "شیپور" to listOf("com.sheypoor.mobile", "sheypoor"),
                      "بله" to listOf("ir.nasim", "bale"),
                      "ایتا" to listOf("ir.eitaa.messenger", "eitaa"),
                      "روبیکا" to listOf("app.rbmain.a", "rubika"),
                      "سروش" to listOf("mobi.mmdt.ottplus", "soroush"),
                      "تلگرام" to listOf("org.telegram.messenger", "org.telegram.messenger.web", "telegram"),
                      "telegram" to listOf("org.telegram.messenger", "org.telegram.messenger.web"),
                      "واتساپ" to listOf("com.whatsapp", "whatsapp"),
                      "whatsapp" to listOf("com.whatsapp"),
                      "اینستاگرام" to listOf("com.instagram.android", "instagram"),
                      "instagram" to listOf("com.instagram.android"),
                      "کروم" to listOf("com.android.chrome", "chrome"),
                      "chrome" to listOf("com.android.chrome"),
                      "یوتیوب" to listOf("com.google.android.youtube", "youtube"),
                      "youtube" to listOf("com.google.android.youtube"),
                      "جیمیل" to listOf("com.google.android.gm", "gmail"),
                      "gmail" to listOf("com.google.android.gm"),
                      "گوگل" to listOf("com.google.android.googlequicksearchbox", "google"),
                      "google" to listOf("com.google.android.googlequicksearchbox"),
                      "نقشه" to listOf("com.google.android.apps.maps", "maps"),
                      "maps" to listOf("com.google.android.apps.maps"),
                      "بلد" to listOf("ir.balad", "balad"),
                      "نشان" to listOf("org.rajman.neshan.traffic.navigator", "neshan"),
                      "بازار" to listOf("com.farsitel.bazaar", "bazaar"),
                      "مایکت" to listOf("ir.mservices.market", "myket"),
                      "فروشگاه" to listOf("com.android.vending", "play store"),
                      "پلی استور" to listOf("com.android.vending"),
                      "تنظیمات" to listOf("com.android.settings", "settings"),
                      "settings" to listOf("com.android.settings"),
                      "دوربین" to listOf("com.android.camera", "camera"),
                      "گالری" to listOf("com.miui.gallery", "com.google.android.apps.photos", "gallery"),
                      "ساعت" to listOf("com.android.deskclock", "clock"),
                      "ماشینحساب" to listOf("com.miui.calculator", "com.google.android.calculator", "calculator"),
                      "پیامک" to listOf("com.google.android.apps.messaging", "com.android.mms", "messages"),
                      "تماس" to listOf("com.android.dialer", "com.android.contacts", "phone"),
                      "یادداشت" to listOf("com.miui.notes", "com.google.android.keep", "notes"),
                      "تقویم" to listOf("com.google.android.calendar", "com.android.calendar", "calendar"),
                      "کیوی" to listOf("com.kiwibrowser.browser", "kiwi")
                  )

                  fun normalizeName(input: String): String {
                      return input
                          .lowercase()
                          .replace('\u064a', '\u06cc')
                          .replace('\u0643', '\u06a9')
                          .replace('\u0622', '\u0627')
                          .replace('\u0623', '\u0627')
                          .replace('\u0625', '\u0627')
                          .replace("\u200c", "")
                          .replace(" ", "")
                          .replace("-", "")
                          .replace("_", "")
                          .trim()
                  }
              }

              private val lastElements = mutableListOf<UiElement>()

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  notifyListeners()
              }

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  notifyListeners()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (instance == null) {
                      instance = this
                      notifyListeners()
                  }
                  val pkg = event?.packageName?.toString()
                  if (!pkg.isNullOrBlank() && pkg != "com.android.systemui") {
                      lastObservedPackage = pkg
                  }
              }

              override fun onInterrupt() {
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  if (instance === this) {
                      instance = null
                      notifyListeners()
                  }
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  if (instance === this) {
                      instance = null
                      notifyListeners()
                  }
                  super.onDestroy()
              }

              fun getForegroundPackage(): String {
                  val rootPkg = try { rootInActiveWindow?.packageName?.toString() } catch (_: Exception) { null }
                  if (!rootPkg.isNullOrBlank()) {
                      lastObservedPackage = rootPkg
                      return rootPkg
                  }
                  return lastObservedPackage
              }

              fun getInstalledLaunchableApps(): List<AppEntry> {
                  val intent = Intent(Intent.ACTION_MAIN, null).apply {
                      addCategory(Intent.CATEGORY_LAUNCHER)
                  }
                  val resolved = try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                          packageManager.queryIntentActivities(
                              intent,
                              PackageManager.ResolveInfoFlags.of(0L)
                          )
                      } else {
                          @Suppress("DEPRECATION")
                          packageManager.queryIntentActivities(intent, 0)
                      }
                  } catch (_: Exception) {
                      emptyList()
                  }

                  val seen = HashSet<String>()
                  val apps = mutableListOf<AppEntry>()
                  for (ri in resolved) {
                      val pkg = ri.activityInfo?.packageName ?: continue
                      if (pkg == packageName) continue
                      if (!seen.add(pkg)) continue
                      val label = try {
                          ri.loadLabel(packageManager)?.toString()?.trim().orEmpty()
                      } catch (_: Exception) {
                          pkg
                      }
                      apps.add(AppEntry(label.ifEmpty { pkg }, pkg))
                  }
                  return apps.sortedBy { it.label.lowercase() }
              }

              fun buildRelevantAppsSummary(userGoal: String, maxApps: Int = 55): String {
                  val all = getInstalledLaunchableApps()
                  if (all.isEmpty()) return "هیچ برنامه قابل اجرایی یافت نشد."
                  val normGoal = normalizeName(userGoal)
                  val prioritized = mutableListOf<AppEntry>()
                  val others = mutableListOf<AppEntry>()

                  for (app in all) {
                      val nLabel = normalizeName(app.label)
                      val nPkg = normalizeName(app.packageName)
                      val aliasHit = APP_ALIASES.entries.any { (k, vals) ->
                          normGoal.contains(normalizeName(k)) &&
                              vals.any { v -> nPkg.contains(normalizeName(v)) || nLabel.contains(normalizeName(v)) }
                      }
                      if (aliasHit || (nLabel.length >= 2 && normGoal.contains(nLabel))) {
                          prioritized.add(app)
                      } else {
                          others.add(app)
                      }
                  }

                  val combined = (prioritized + others).take(maxApps)
                  return combined.joinToString("\n") { "- ${it.label} (${it.packageName})" }
              }

              suspend fun openApp(query: String): ActionResult {
                  val clean = query.trim()
                  if (clean.isEmpty()) return ActionResult(false, "نام برنامه خالی است.")

                  val apps = getInstalledLaunchableApps()
                  val normQuery = normalizeName(clean)

                  var matched: AppEntry? = apps.firstOrNull { it.packageName.equals(clean, ignoreCase = true) }

                  if (matched == null) {
                      val aliasTargets = mutableListOf<String>()
                      for ((k, vals) in APP_ALIASES) {
                          val nk = normalizeName(k)
                          if (normQuery == nk || normQuery.contains(nk) || nk.contains(normQuery)) {
                              aliasTargets.addAll(vals)
                          }
                      }
                      for (target in aliasTargets) {
                          val nt = normalizeName(target)
                          matched = apps.firstOrNull {
                              it.packageName.equals(target, ignoreCase = true) ||
                                  normalizeName(it.packageName).contains(nt) ||
                                  normalizeName(it.label).contains(nt)
                          }
                          if (matched != null) break
                      }
                  }

                  if (matched == null) {
                      matched = apps.firstOrNull { normalizeName(it.label) == normQuery }
                  }

                  if (matched == null) {
                      matched = apps.firstOrNull {
                          val nl = normalizeName(it.label)
                          val np = normalizeName(it.packageName)
                          nl.contains(normQuery) || (nl.length >= 3 && normQuery.contains(nl)) || np.contains(normQuery)
                      }
                  }

                  val targetPkg = matched?.packageName ?: if (clean.contains(".")) clean else null
                  val targetLabel = matched?.label ?: clean

                  if (targetPkg == null) {
                      return ActionResult(
                          false,
                          "برنامه «$clean» روی این گوشی نصب نیست یا در لیست برنامه‌های قابل اجرا یافت نشد."
                      )
                  }

                  val launchIntent = packageManager.getLaunchIntentForPackage(targetPkg)
                      ?: return ActionResult(
                          false,
                          "برنامه «$targetLabel» ($targetPkg) روی این گوشی نصب نیست یا قابل اجرا نیست."
                      )

                  return try {
                      launchIntent.addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK or
                              Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED or
                              Intent.FLAG_ACTIVITY_CLEAR_TOP
                      )
                      startActivity(launchIntent)
                      var switched = false
                      var fg = getForegroundPackage()
                      for (i in 0 until 8) {
                          delay(250)
                          fg = getForegroundPackage()
                          if (fg == targetPkg || (fg.isNotBlank() && fg != packageName)) {
                              switched = true
                              break
                          }
                      }
                      if (switched) {
                          ActionResult(true, "برنامه «$targetLabel» ($targetPkg) با موفقیت باز شد. صفحه فعلی: $fg")
                      } else {
                          ActionResult(
                              false,
                              "فرمان باز کردن «$targetLabel» ($targetPkg) ارسال شد اما صفحه هنوز روی $fg مانده است."
                          )
                      }
                  } catch (e: Exception) {
                      ActionResult(false, "خطا در باز کردن «$targetLabel»: ${e.message}")
                  }
              }

              fun captureSnapshot(): ScreenSnapshot {
                  val root = rootInActiveWindow
                  val fg = getForegroundPackage()
                  val elements = mutableListOf<UiElement>()
                  val sb = StringBuilder()

                  if (root != null) {
                      traverse(root, elements, 0)
                  }

                  lastElements.clear()
                  lastElements.addAll(elements)

                  for (el in elements) {
                      val flags = buildString {
                          if (el.clickable) append("C")
                          if (el.editable) append("E")
                          if (el.scrollable) append("S")
                      }
                      val label = buildString {
                          if (el.text.isNotBlank()) append("t=\"${el.text.take(65)}\"")
                          if (el.desc.isNotBlank() && el.desc != el.text) {
                              if (isNotEmpty()) append(" ")
                              append("d=\"${el.desc.take(55)}\"")
                          }
                          if (el.viewId.isNotBlank()) {
                              if (isNotEmpty()) append(" ")
                              append("id=${el.viewId}")
                          }
                      }
                      val cx = el.bounds.centerX()
                      val cy = el.bounds.centerY()
                      sb.append("[${el.index}] ($flags) $label @($cx,$cy)\n")
                  }

                  val treeStr = sb.toString().ifBlank { "(هیچ المان قابل تعاملی روی صفحه خوانده نشد)" }
                  return ScreenSnapshot(
                      foregroundPackage = fg,
                      elements = elements,
                      compactTree = treeStr,
                      hash = (fg + "|" + treeStr).hashCode()
                  )
              }

              private fun traverse(node: AccessibilityNodeInfo, out: MutableList<UiElement>, depth: Int) {
                  if (out.size >= 85 || depth > 28) return
                  if (!node.isVisibleToUser) return

                  val text = node.text?.toString()?.trim().orEmpty()
                  val desc = node.contentDescription?.toString()?.trim().orEmpty()
                  val rawId = node.viewIdResourceName?.substringAfterLast("/")?.trim().orEmpty()
                  val cls = node.className?.toString()?.substringAfterLast(".")?.trim().orEmpty()
                  val clickable = node.isClickable
                  val editable = node.isEditable || cls.contains("EditText", ignoreCase = true)
                  val scrollable = node.isScrollable

                  val rect = Rect()
                  node.getBoundsInScreen(rect)
                  val validBounds = rect.width() > 4 && rect.height() > 4

                  val keep = validBounds && (
                      clickable || editable || scrollable || text.isNotBlank() || desc.isNotBlank()
                  )

                  if (keep) {
                      out.add(
                          UiElement(
                              index = out.size,
                              text = text.replace("\n", " "),
                              desc = desc.replace("\n", " "),
                              viewId = rawId,
                              className = cls,
                              clickable = clickable,
                              editable = editable,
                              scrollable = scrollable,
                              bounds = rect
                          )
                      )
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      traverse(child, out, depth + 1)
                  }
              }

              private fun findNodeByBounds(root: AccessibilityNodeInfo?, target: Rect): AccessibilityNodeInfo? {
                  if (root == null) return null
                  val r = Rect()
                  root.getBoundsInScreen(r)
                  if (r == target) return root
                  for (i in 0 until root.childCount) {
                      val child = root.getChild(i) ?: continue
                      val found = findNodeByBounds(child, target)
                      if (found != null) return found
                  }
                  return null
              }

              suspend fun clickElement(index: Int?, x: Int?, y: Int?): ActionResult {
                  val fg = getForegroundPackage()
                  if (fg == packageName) {
                      return ActionResult(
                          false,
                          "مسدود شد: صفحه فعلی خود اپلیکیشن ایجنت است. ابتدا با open_app یا home از برنامه ایجنت خارج شو."
                      )
                  }

                  if (index != null && index in lastElements.indices) {
                      val el = lastElements[index]
                      val node = findNodeByBounds(rootInActiveWindow, el.bounds)
                      var cur = node
                      while (cur != null) {
                          if (cur.isClickable) {
                              if (cur.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                                  return ActionResult(true, "کلیک روی [$index] (${el.text.ifBlank { el.desc.ifBlank { el.viewId } }})")
                              }
                              break
                          }
                          cur = cur.parent
                      }
                      val ok = tapAt(el.bounds.centerX().toFloat(), el.bounds.centerY().toFloat())
                      return if (ok) {
                          ActionResult(true, "لمس مختصات [$index] @(${el.bounds.centerX()},${el.bounds.centerY()})")
                      } else {
                          ActionResult(false, "کلیک روی [$index] ناموفق بود.")
                      }
                  }

                  if (x != null && y != null) {
                      val ok = tapAt(x.toFloat(), y.toFloat())
                      return if (ok) ActionResult(true, "لمس مختصات @($x,$y)")
                      else ActionResult(false, "لمس مختصات @($x,$y) ناموفق بود.")
                  }

                  return ActionResult(false, "شماره المان یا مختصات معتبر برای کلیک ارسال نشد.")
              }

              suspend fun longClickElement(index: Int?, x: Int?, y: Int?): ActionResult {
                  val fg = getForegroundPackage()
                  if (fg == packageName) {
                      return ActionResult(false, "مسدود شد: صفحه فعلی خود ایجنت است.")
                  }
                  val tx: Float
                  val ty: Float
                  if (index != null && index in lastElements.indices) {
                      val b = lastElements[index].bounds
                      tx = b.centerX().toFloat()
                      ty = b.centerY().toFloat()
                  } else if (x != null && y != null) {
                      tx = x.toFloat()
                      ty = y.toFloat()
                  } else {
                      return ActionResult(false, "مختصات لمس طولانی معتبر نیست.")
                  }
                  val ok = gestureTap(tx, ty, 700L)
                  return if (ok) ActionResult(true, "لمس طولانی انجام شد.") else ActionResult(false, "لمس طولانی ناموفق بود.")
              }

              suspend fun typeText(index: Int?, text: String, submit: Boolean): ActionResult {
                  val fg = getForegroundPackage()
                  if (fg == packageName) {
                      return ActionResult(false, "مسدود شد: صفحه فعلی خود ایجنت است. نباید داخل چت ایجنت تایپ کنی.")
                  }

                  var targetNode: AccessibilityNodeInfo? = null
                  if (index != null && index in lastElements.indices) {
                      val el = lastElements[index]
                      targetNode = findNodeByBounds(rootInActiveWindow, el.bounds)
                      tapAt(el.bounds.centerX().toFloat(), el.bounds.centerY().toFloat())
                      delay(250)
                  }

                  if (targetNode == null) {
                      targetNode = rootInActiveWindow?.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  }

                  if (targetNode == null) {
                      val editable = lastElements.firstOrNull { it.editable }
                      if (editable != null) {
                          targetNode = findNodeByBounds(rootInActiveWindow, editable.bounds)
                          tapAt(editable.bounds.centerX().toFloat(), editable.bounds.centerY().toFloat())
                          delay(250)
                      }
                  }

                  if (targetNode == null) {
                      return ActionResult(false, "کادر متنی برای تایپ پیدا نشد.")
                  }

                  targetNode.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                  val args = Bundle().apply {
                      putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  }
                  var typed = targetNode.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)

                  if (!typed) {
                      try {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cm.setPrimaryClip(ClipData.newPlainText("agent_input", text))
                          delay(120)
                          typed = targetNode.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                      } catch (_: Exception) {
                      }
                  }

                  if (typed && submit && Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      delay(200)
                      targetNode.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                  }

                  return if (typed) {
                      ActionResult(true, "متن «$text» تایپ شد${if (submit) " و ارسال شد" else ""}.")
                  } else {
                      ActionResult(false, "تایپ متن در این کادر ناموفق بود.")
                  }
              }

              suspend fun scroll(direction: String): ActionResult {
                  val fg = getForegroundPackage()
                  if (fg == packageName) {
                      return ActionResult(false, "مسدود شد: صفحه فعلی خود ایجنت است.")
                  }
                  val dm = resources.displayMetrics
                  val w = dm.widthPixels.toFloat()
                  val h = dm.heightPixels.toFloat()
                  val (x1, y1, x2, y2) = when (direction.lowercase()) {
                      "down" -> listOf(w * 0.5f, h * 0.78f, w * 0.5f, h * 0.25f)
                      "up" -> listOf(w * 0.5f, h * 0.25f, w * 0.5f, h * 0.78f)
                      "left" -> listOf(w * 0.80f, h * 0.5f, w * 0.20f, h * 0.5f)
                      "right" -> listOf(w * 0.20f, h * 0.5f, w * 0.80f, h * 0.5f)
                      else -> listOf(w * 0.5f, h * 0.75f, w * 0.5f, h * 0.25f)
                  }
                  val ok = swipe(x1, y1, x2, y2, 320L)
                  return if (ok) ActionResult(true, "اسکرول به سمت $direction انجام شد.")
                  else ActionResult(false, "اسکرول ناموفق بود.")
              }

              fun goBack(): ActionResult {
                  val ok = performGlobalAction(GLOBAL_ACTION_BACK)
                  return if (ok) ActionResult(true, "دکمه بازگشت زده شد.") else ActionResult(false, "بازگشت ناموفق بود.")
              }

              fun goHome(): ActionResult {
                  val ok = performGlobalAction(GLOBAL_ACTION_HOME)
                  return if (ok) ActionResult(true, "به صفحه اصلی گوشی رفت.") else ActionResult(false, "رفتن به صفحه اصلی ناموفق بود.")
              }

              fun openRecents(): ActionResult {
                  val ok = performGlobalAction(GLOBAL_ACTION_RECENTS)
                  return if (ok) ActionResult(true, "برنامه‌های اخیر باز شد.") else ActionResult(false, "باز کردن برنامه‌های اخیر ناموفق بود.")
              }

              private suspend fun tapAt(x: Float, y: Float): Boolean = gestureTap(x, y, 70L)

              private suspend fun gestureTap(x: Float, y: Float, durationMs: Long): Boolean {
                  return suspendCancellableCoroutine { cont ->
                      val path = Path().apply { moveTo(x, y) }
                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0L, durationMs))
                          .build()
                      val dispatched = dispatchGesture(gesture, object : GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(true)
                          }
                          override fun onCancelled(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(false)
                          }
                      }, null)
                      if (!dispatched && cont.isActive) cont.resume(false)
                  }
              }

              private suspend fun swipe(x1: Float, y1: Float, x2: Float, y2: Float, durationMs: Long): Boolean {
                  return suspendCancellableCoroutine { cont ->
                      val path = Path().apply {
                          moveTo(x1, y1)
                          lineTo(x2, y2)
                      }
                      val gesture = GestureDescription.Builder()
                          .addStroke(GestureDescription.StrokeDescription(path, 0L, durationMs))
                          .build()
                      val dispatched = dispatchGesture(gesture, object : GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(true)
                          }
                          override fun onCancelled(gestureDescription: GestureDescription?) {
                              if (cont.isActive) cont.resume(false)
                          }
                      }, null)
                      if (!dispatched && cont.isActive) cont.resume(false)
                  }
              }

              suspend fun captureScreenshotBase64(): String? {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R) return null
                  return suspendCancellableCoroutine { cont ->
                      try {
                          takeScreenshot(
                              Display.DEFAULT_DISPLAY,
                              mainExecutor,
                              object : TakeScreenshotCallback {
                                  override fun onSuccess(result: ScreenshotResult) {
                                      try {
                                          val hw = Bitmap.wrapHardwareBuffer(result.hardwareBuffer, result.colorSpace)
                                          result.hardwareBuffer.close()
                                          if (hw == null) {
                                              if (cont.isActive) cont.resume(null)
                                              return
                                          }
                                          val soft = hw.copy(Bitmap.Config.ARGB_8888, false)
                                          hw.recycle()
                                          val scale = 540f / maxOf(soft.width, 1)
                                          val scaled = if (scale < 1f) {
                                              Bitmap.createScaledBitmap(
                                                  soft,
                                                  540,
                                                  (soft.height * scale).toInt().coerceAtLeast(1),
                                                  true
                                              ).also { soft.recycle() }
                                          } else {
                                              soft
                                          }
                                          val out = ByteArrayOutputStream()
                                          scaled.compress(Bitmap.CompressFormat.JPEG, 55, out)
                                          scaled.recycle()
                                          val b64 = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
                                          if (cont.isActive) cont.resume(b64)
                                      } catch (_: Exception) {
                                          if (cont.isActive) cont.resume(null)
                                      }
                                  }

                                  override fun onFailure(errorCode: Int) {
                                      if (cont.isActive) cont.resume(null)
                                  }
                              }
                          )
                      } catch (_: Exception) {
                          if (cont.isActive) cont.resume(null)
                      }
                  }
              }
          }
          ''')

          write(os.path.join(PKG_DIR, "GeminiClient.kt"), r'''
          package com.aiagent.android

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL

          data class PlannedAction(
              val type: String,
              val index: Int? = null,
              val x: Int? = null,
              val y: Int? = null,
              val text: String? = null,
              val submit: Boolean = false,
              val direction: String? = null,
              val app: String? = null,
              val ms: Long? = null
          )

          data class AgentPlan(
              val thought: String,
              val remaining: String,
              val status: String,
              val reply: String,
              val actions: List<PlannedAction>
          )

          class GeminiClient(
              private val apiKey: String,
              private val model: String
          ) {
              private val systemPrompt = """
                  تو یک ایجنت هوشمند، دقیق، سریع و کاملاً صادق برای کنترل گوشی اندروید هستی.
                  پاسخ تو باید فقط و فقط یک آبجکت JSON معتبر (بدون متن اضافه یا Markdown) با این ساختار باشد:
                  {
                    "thought": "تحلیل کوتاه قدم فعلی به فارسی",
                    "remaining": "بخش‌های باقی‌مانده از دستور کاربر (یا خالی اگر همه انجام شده)",
                    "status": "continue" | "done" | "fail" | "need_screenshot",
                    "reply": "پیام کوتاه فارسی برای کاربر در حالت done یا fail",
                    "actions": [
                      {"type": "open_app", "app": "نام یا پکیج برنامه"},
                      {"type": "click", "index": 5},
                      {"type": "type", "index": 5, "text": "متن", "submit": true}
                    ]
                  }

                  اکشن‌های مجاز:
                  - open_app: {"type":"open_app","app":"نام یا packageName از لیست برنامه‌های نصب‌شده"}
                  - click: {"type":"click","index":N} یا {"type":"click","x":X,"y":Y}
                  - long_click: {"type":"long_click","index":N}
                  - type: {"type":"type","index":N,"text":"متن","submit":true/false}
                  - scroll: {"type":"scroll","direction":"down"|"up"|"left"|"right"}
                  - back: {"type":"back"}
                  - home: {"type":"home"}
                  - recents: {"type":"recents"}
                  - wait: {"type":"wait","ms":1000}

                  قوانین حیاتی و بدون استثنا:
                  1. قانون مطلق صداقت: هرگز ادعا نکن برنامه‌ای باز شده یا کاری انجام شده مگر اینکه در foreground_package و ui_nodes فعلی واقعاً آن را ببینی. اگر open_app خطا داد یا برنامه نصب نبود، صادقانه status را "fail" بگذار و به فارسی دلیل واقعی را بگو.
                  2. اگر foreground_package برابر com.aiagent.android است، یعنی هنوز داخل خود چت ایجنت هستی؛ هرگز روی المان‌های خود ایجنت click یا type نکن و اول با open_app (یا home) برنامه مقصد را باز کن.
                  3. برای سرعت بالا می‌توانی تا ۳ اکشن مطمئن پشت‌سرهم بدهی (مثلاً click کادر جستجو و سپس type با submit:true).
                  4. تا زمانی که همه بخش‌های دستور کاربر واقعاً روی صفحه تکمیل نشده‌اند، status را "done" نگذار.
                  5. اگر دکمه‌ها بی‌متن بودند یا صفحه گیج‌کننده بود، status را "need_screenshot" بگذار تا تصویر صفحه برایت ارسال شود.
              """.trimIndent()

              suspend fun planNextStep(
                  userGoal: String,
                  step: Int,
                  maxSteps: Int,
                  snapshot: ScreenSnapshot,
                  history: List<String>,
                  installedAppsSummary: String?,
                  screenshotBase64: String?
              ): AgentPlan = withContext(Dispatchers.IO) {
                  val promptBuilder = StringBuilder()
                  promptBuilder.append("دستور کاربر: $userGoal\n")
                  promptBuilder.append("مرحله: $step از $maxSteps\n")
                  promptBuilder.append("foreground_package: ${snapshot.foregroundPackage}\n")
                  if (!installedAppsSummary.isNullOrBlank()) {
                      promptBuilder.append("\nبرنامه‌های نصب‌شده روی گوشی:\n$installedAppsSummary\n")
                  }
                  if (history.isNotEmpty()) {
                      promptBuilder.append("\nگزارش مراحل قبلی:\n")
                      promptBuilder.append(history.takeLast(8).joinToString("\n"))
                      promptBuilder.append("\n")
                  }
                  promptBuilder.append("\nالمان‌های فعلی صفحه (ui_nodes):\n")
                  promptBuilder.append(snapshot.compactTree.take(7000))

                  val parts = JSONArray().apply {
                      put(JSONObject().put("text", promptBuilder.toString()))
                      if (!screenshotBase64.isNullOrBlank()) {
                          put(
                              JSONObject().put(
                                  "inline_data",
                                  JSONObject()
                                      .put("mime_type", "image/jpeg")
                                      .put("data", screenshotBase64)
                              )
                          )
                      }
                  }

                  val body = JSONObject()
                      .put(
                          "system_instruction",
                          JSONObject().put("parts", JSONArray().put(JSONObject().put("text", systemPrompt)))
                      )
                      .put(
                          "contents",
                          JSONArray().put(JSONObject().put("role", "user").put("parts", parts))
                      )
                      .put(
                          "generationConfig",
                          JSONObject()
                              .put("temperature", 0.1)
                              .put("responseMimeType", "application/json")
                      )

                  val endpoint = "https://generativelanguage.googleapis.com/v1beta/models/${model.trim()}:generateContent?key=${apiKey.trim()}"
                  var lastErr: Exception? = null

                  for (attempt in 1..4) {
                      try {
                          val conn = (URL(endpoint).openConnection() as HttpURLConnection).apply {
                              requestMethod = "POST"
                              setRequestProperty("Content-Type", "application/json; charset=UTF-8")
                              connectTimeout = 20000
                              readTimeout = 35000
                              doOutput = true
                          }
                          OutputStreamWriter(conn.outputStream, Charsets.UTF_8).use { it.write(body.toString()) }
                          val code = conn.responseCode
                          val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                          val rawResp = stream?.let { BufferedReader(InputStreamReader(it, Charsets.UTF_8)).readText() }.orEmpty()
                          conn.disconnect()

                          if (code in 200..299) {
                              return@withContext parsePlan(rawResp)
                          }
                          if (code == 429 || code == 500 || code == 502 || code == 503 || code == 504) {
                              lastErr = Exception("API $code: ${rawResp.take(180)}")
                              delay(attempt * 2000L)
                              continue
                          }
                          throw Exception("API $code: ${rawResp.take(260)}")
                      } catch (e: Exception) {
                          lastErr = e
                          val msg = e.message.orEmpty().lowercase()
                          val retryable = msg.contains("timeout") || msg.contains("timed out") ||
                              msg.contains("429") || msg.contains("503") || msg.contains("502") || msg.contains("500")
                          if (retryable && attempt < 4) {
                              delay(attempt * 2000L)
                              continue
                          }
                          throw e
                      }
                  }
                  throw lastErr ?: Exception("خطای ناشناخته در ارتباط با Gemini")
              }

              private fun parsePlan(rawResp: String): AgentPlan {
                  val root = JSONObject(rawResp)
                  val text = root.getJSONArray("candidates")
                      .getJSONObject(0)
                      .getJSONObject("content")
                      .getJSONArray("parts")
                      .getJSONObject(0)
                      .getString("text")
                      .trim()

                  val cleaned = text
                      .removePrefix("```json")
                      .removePrefix("```")
                      .removeSuffix("```")
                      .trim()

                  val jsonStart = cleaned.indexOf('{')
                  val jsonEnd = cleaned.lastIndexOf('}')
                  val jsonStr = if (jsonStart >= 0 && jsonEnd > jsonStart) {
                      cleaned.substring(jsonStart, jsonEnd + 1)
                  } else cleaned

                  val obj = JSONObject(jsonStr)
                  val actionsArr = obj.optJSONArray("actions") ?: JSONArray()
                  val actions = mutableListOf<PlannedAction>()
                  for (i in 0 until minOf(actionsArr.length(), 3)) {
                      val a = actionsArr.optJSONObject(i) ?: continue
                      actions.add(
                          PlannedAction(
                              type = a.optString("type", "").lowercase(),
                              index = if (a.has("index") && !a.isNull("index")) a.optInt("index") else null,
                              x = if (a.has("x") && !a.isNull("x")) a.optInt("x") else null,
                              y = if (a.has("y") && !a.isNull("y")) a.optInt("y") else null,
                              text = if (a.has("text") && !a.isNull("text")) a.optString("text") else null,
                              submit = a.optBoolean("submit", false),
                              direction = if (a.has("direction") && !a.isNull("direction")) a.optString("direction") else null,
                              app = if (a.has("app") && !a.isNull("app")) a.optString("app") else null,
                              ms = if (a.has("ms") && !a.isNull("ms")) a.optLong("ms") else null
                          )
                      )
                  }

                  return AgentPlan(
                      thought = obj.optString("thought", ""),
                      remaining = obj.optString("remaining", ""),
                      status = obj.optString("status", "continue").lowercase(),
                      reply = obj.optString("reply", ""),
                      actions = actions
                  )
              }
          }
          ''')

          write(os.path.join(PKG_DIR, "AgentRunner.kt"), r'''
          package com.aiagent.android

          import android.content.Context
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.delay

          class AgentRunner(
              private val context: Context,
              private val apiKey: String,
              private val model: String,
              private val maxSteps: Int,
              private val onUpdate: (String) -> Unit
          ) {
              suspend fun run(userGoal: String): String {
                  var service = AgentAccessibilityService.instance
                  if (service == null && AccessibilityHelper.isEnabledInSettings(context)) {
                      for (i in 0 until 10) {
                          delay(250)
                          service = AgentAccessibilityService.instance
                          if (service != null) break
                      }
                  }

                  if (service == null) {
                      return when (AccessibilityHelper.getState(context)) {
                          ServiceState.ENABLED_BUT_SUSPENDED ->
                              "سرویس دسترسی در تنظیمات روشن است، اما سیستم گوشی (شیائومی) اتصالش را در پس‌زمینه معلق کرده است. دکمه «اتصال مجدد» بالای صفحه را بزن، کلید بالایی «استفاده از Android AI Agent Service» را یک‌بار خاموش و دوباره روشن کن (و از تنظیمات برنامه، Autostart و باتری «بدون محدودیت» را فعال کن)."
                          else ->
                              "سرویس دسترسی (Accessibility) خاموش است. روی دکمه «روشن کردن» بالای صفحه بزن و کلید بالایی Android AI Agent Service را روشن کن."
                      }
                  }

                  val client = GeminiClient(apiKey, model)
                  val history = mutableListOf<String>()
                  val appsSummary = service.buildRelevantAppsSummary(userGoal)
                  var lastHash = 0
                  var sameHashCount = 0
                  var forceScreenshot = false
                  var rejectedEarlyDone = false
                  var lastActionFailed = false

                  for (step in 1..maxSteps) {
                      val snapshot = service.captureSnapshot()
                      if (snapshot.hash == lastHash) {
                          sameHashCount++
                      } else {
                          sameHashCount = 0
                          lastHash = snapshot.hash
                      }

                      val needVision = forceScreenshot ||
                          sameHashCount >= 2 ||
                          (snapshot.elements.size < 4 && snapshot.foregroundPackage != context.packageName)
                      forceScreenshot = false

                      val screenshotB64 = if (needVision) service.captureScreenshotBase64() else null
                      val appsForStep = if (step == 1 || lastActionFailed) appsSummary else null

                      val plan = try {
                          client.planNextStep(
                              userGoal = userGoal,
                              step = step,
                              maxSteps = maxSteps,
                              snapshot = snapshot,
                              history = history,
                              installedAppsSummary = appsForStep,
                              screenshotBase64 = screenshotB64
                          )
                      } catch (e: CancellationException) {
                          throw e
                      } catch (e: Exception) {
                          return "خطا در مرحله $step: ${e.message}"
                      }

                      if (plan.status == "need_screenshot") {
                          forceScreenshot = true
                          history.add("مرحله $step: درخواست تصویر صفحه")
                          continue
                      }

                      if (plan.status == "fail") {
                          return plan.reply.ifBlank { plan.thought.ifBlank { "انجام این دستور ممکن نشد." } }
                      }

                      if (plan.status == "done") {
                          val stillInAgentOnStep1 = (step == 1 && snapshot.foregroundPackage == context.packageName)
                          val hasRemaining = plan.remaining.isNotBlank() &&
                              !plan.remaining.equals("none", true) &&
                              !plan.remaining.equals("هیچ", true) &&
                              !plan.remaining.equals("ندارد", true)

                          if ((stillInAgentOnStep1 || hasRemaining || lastActionFailed) && !rejectedEarlyDone) {
                              rejectedEarlyDone = true
                              history.add("مرحله $step: توقف زودهنگام رد شد؛ هنوز روی ${snapshot.foregroundPackage} هستی یا کار کامل نشده. باید اقدام واقعی انجام دهی یا صادقانه fail بدهی.")
                              continue
                          }
                          return plan.reply.ifBlank { "دستور با موفقیت انجام شد." }
                      }

                      if (plan.actions.isEmpty()) {
                          history.add("مرحله $step: هیچ اکشنی برگردانده نشد.")
                          forceScreenshot = true
                          delay(400)
                          continue
                      }

                      if (plan.thought.isNotBlank()) {
                          onUpdate("مرحله $step: ${plan.thought}")
                      }

                      lastActionFailed = false
                      for (act in plan.actions) {
                          val res = when (act.type) {
                              "open_app" -> service.openApp(act.app.orEmpty())
                              "click" -> service.clickElement(act.index, act.x, act.y)
                              "long_click" -> service.longClickElement(act.index, act.x, act.y)
                              "type" -> service.typeText(act.index, act.text.orEmpty(), act.submit)
                              "scroll" -> service.scroll(act.direction ?: "down")
                              "back" -> service.goBack()
                              "home" -> service.goHome()
                              "recents" -> service.openRecents()
                              "wait" -> {
                                  delay((act.ms ?: 1000L).coerceIn(200L, 4000L))
                                  ActionResult(true, "مکث انجام شد.")
                              }
                              else -> ActionResult(false, "اکشن ناشناخته: ${act.type}")
                          }

                          history.add("مرحله $step [${act.type}]: ${if (res.success) "موفق" else "ناموفق"} - ${res.message}")
                          if (!res.success) {
                              lastActionFailed = true
                              onUpdate("⚠️ ${res.message}")
                              break
                          }
                          delay(if (act.type == "open_app") 500L else 380L)
                      }
                  }

                  return "حداکثر تعداد مراحل ($maxSteps) به پایان رسید و کار هنوز کامل نشده است."
              }
          }
          ''')

          write(os.path.join(PKG_DIR, "MainActivity.kt"), r'''
          package com.aiagent.android

          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.CancellationException
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.launch
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.ArrayDeque

          data class ChatMessage(
              val id: Long,
              val isUser: Boolean,
              val text: String
          )

          class MainActivity : AppCompatActivity() {

              private val prefs by lazy { getSharedPreferences("agent_prefs_v16", MODE_PRIVATE) }
              private val messages = mutableListOf<ChatMessage>()
              private val commandQueue = ArrayDeque<String>()
              private var runningJob: Job? = null
              private var isProcessingQueue = false

              private lateinit var statusBanner: TextView
              private lateinit var statusActionBtn: Button
              private lateinit var chatScroll: ScrollView
              private lateinit var chatContainer: LinearLayout
              private lateinit var inputBox: EditText
              private lateinit var sendBtn: Button
              private lateinit var stopBtn: Button

              private val connectionListener: () -> Unit = {
                  runOnUiThread { updateAccessibilityBanner() }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.layoutDirection = View.LAYOUT_DIRECTION_RTL
                  buildUi()
                  loadChatHistory()
                  renderChat()
                  AgentAccessibilityService.addConnectionListener(connectionListener)
                  updateAccessibilityBanner()
              }

              override fun onResume() {
                  super.onResume()
                  updateAccessibilityBanner()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) updateAccessibilityBanner()
              }

              override fun onDestroy() {
                  AgentAccessibilityService.removeConnectionListener(connectionListener)
                  super.onDestroy()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              private fun roundedBg(colorHex: String, radiusDp: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(colorHex))
                      cornerRadius = dp(radiusDp).toFloat()
                  }
              }

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }

                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setPadding(dp(12), dp(12), dp(12), dp(12))
                  }

                  val titleTv = TextView(this).apply {
                      text = "ایجنت هوشمند ۱.۶"
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val clearBtn = Button(this).apply {
                      text = "حذف چت"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = roundedBg("#DC2626", 8)
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                      setOnClickListener { confirmClearChat() }
                  }

                  val settingsBtn = Button(this).apply {
                      text = "تنظیمات"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = roundedBg("#334155", 8)
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { marginStart = dp(8) }
                      setOnClickListener { showSettingsDialog() }
                  }

                  header.addView(titleTv)
                  header.addView(clearBtn)
                  header.addView(settingsBtn)
                  root.addView(header)

                  val statusRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#172033"))
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                  }

                  statusBanner = TextView(this).apply {
                      textSize = 12.5f
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  statusActionBtn = Button(this).apply {
                      text = "تنظیمات دسترسی"
                      textSize = 11.5f
                      setTextColor(Color.WHITE)
                      background = roundedBg("#2563EB", 8)
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                      setOnClickListener { openAccessibilitySettings() }
                  }

                  statusRow.addView(statusBanner)
                  statusRow.addView(statusActionBtn)
                  root.addView(statusRow)

                  chatScroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          0,
                          1f
                      )
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                  }
                  chatContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  chatScroll.addView(chatContainer)
                  root.addView(chatScroll)

                  val bottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                  }

                  inputBox = EditText(this).apply {
                      hint = "دستورت را بنویس (مثلاً: ترب را باز کن)..."
                      setHintTextColor(Color.parseColor("#94A3B8"))
                      setTextColor(Color.WHITE)
                      background = roundedBg("#0F172A", 12)
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      textSize = 14f
                      maxLines = 4
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  stopBtn = Button(this).apply {
                      text = "توقف"
                      textSize = 12f
                      setTextColor(Color.WHITE)
                      background = roundedBg("#B91C1C", 10)
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { marginStart = dp(6) }
                      setOnClickListener { stopCurrentTask() }
                  }

                  sendBtn = Button(this).apply {
                      text = "ارسال"
                      textSize = 13f
                      setTextColor(Color.WHITE)
                      background = roundedBg("#16A34A", 10)
                      layoutParams = LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      ).apply { marginStart = dp(6) }
                      setOnClickListener { onSendClicked() }
                  }

                  bottomBar.addView(inputBox)
                  bottomBar.addView(stopBtn)
                  bottomBar.addView(sendBtn)
                  root.addView(bottomBar)

                  setContentView(root)
              }

              private fun updateAccessibilityBanner() {
                  when (AccessibilityHelper.getState(this)) {
                      ServiceState.CONNECTED -> {
                          statusBanner.text = "🟢 سرویس دسترسی فعال و متصل است"
                          statusBanner.setTextColor(Color.parseColor("#4ADE80"))
                          statusActionBtn.visibility = View.GONE
                      }
                      ServiceState.ENABLED_BUT_SUSPENDED -> {
                          statusBanner.text = "🟡 در تنظیمات روشن است، اما شیائومی اتصالش را معلق کرده (یک‌بار خاموش/روشن کن)"
                          statusBanner.setTextColor(Color.parseColor("#FBBF24"))
                          statusActionBtn.text = "اتصال مجدد"
                          statusActionBtn.background = roundedBg("#D97706", 8)
                          statusActionBtn.visibility = View.VISIBLE
                      }
                      ServiceState.DISABLED -> {
                          statusBanner.text = "🔴 سرویس دسترسی خاموش است"
                          statusBanner.setTextColor(Color.parseColor("#F87171"))
                          statusActionBtn.text = "روشن کردن"
                          statusActionBtn.background = roundedBg("#2563EB", 8)
                          statusActionBtn.visibility = View.VISIBLE
                      }
                  }
              }

              private fun openAccessibilitySettings() {
                  try {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  } catch (_: Exception) {
                      Toast.makeText(this, "باز کردن تنظیمات دسترسی ناموفق بود", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun openAppDetailsSettings() {
                  try {
                      val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                          data = Uri.fromParts("package", packageName, null)
                      }
                      startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              private fun showSettingsDialog() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(14), dp(18), dp(6))
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                  }

                  val keyInput = EditText(this).apply {
                      hint = "کلید Gemini API"
                      setText(prefs.getString("api_key", ""))
                  }
                  val modelInput = EditText(this).apply {
                      hint = "نام مدل (پیش‌فرض: gemini-3.5-flash-lite)"
                      setText(prefs.getString("model", "gemini-3.5-flash-lite"))
                  }
                  val stepsInput = EditText(this).apply {
                      hint = "حداکثر مراحل (پیش‌فرض: 40)"
                      setText(prefs.getInt("max_steps", 40).toString())
                  }

                  val accBtn = Button(this).apply {
                      text = "باز کردن تنظیمات دسترس‌پذیری (Accessibility)"
                      setOnClickListener { openAccessibilitySettings() }
                  }
                  val batteryBtn = Button(this).apply {
                      text = "تنظیمات باتری و Autostart برنامه (شیائومی)"
                      setOnClickListener { openAppDetailsSettings() }
                  }

                  layout.addView(TextView(this).apply { text = "کلید Gemini API:" })
                  layout.addView(keyInput)
                  layout.addView(TextView(this).apply { text = "مدل Gemini:" })
                  layout.addView(modelInput)
                  layout.addView(TextView(this).apply { text = "حداکثر مراحل:" })
                  layout.addView(stepsInput)
                  layout.addView(accBtn)
                  layout.addView(batteryBtn)

                  AlertDialog.Builder(this)
                      .setTitle("تنظیمات ایجنت")
                      .setView(layout)
                      .setPositiveButton("ذخیره") { _, _ ->
                          prefs.edit()
                              .putString("api_key", keyInput.text.toString().trim())
                              .putString("model", modelInput.text.toString().trim().ifEmpty { "gemini-3.5-flash-lite" })
                              .putInt("max_steps", stepsInput.text.toString().toIntOrNull()?.coerceIn(5, 60) ?: 40)
                              .apply()
                          Toast.makeText(this, "تنظیمات ذخیره شد", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("بستن", null)
                      .show()
              }

              private fun onSendClicked() {
                  val cmd = inputBox.text.toString().trim()
                  if (cmd.isEmpty()) return

                  val apiKey = prefs.getString("api_key", "").orEmpty().trim()
                  if (apiKey.isEmpty()) {
                      Toast.makeText(this, "ابتدا از بخش تنظیمات، کلید Gemini API را وارد کن", Toast.LENGTH_LONG).show()
                      showSettingsDialog()
                      return
                  }

                  inputBox.setText("")
                  addMessage(isUser = true, text = cmd)
                  commandQueue.addLast(cmd)

                  if (isProcessingQueue) {
                      addMessage(isUser = false, text = "⏳ در صف قرار گرفت؛ بلافاصله بعد از اتمام کار فعلی اجرا می‌شود.")
                  } else {
                      processQueue()
                  }
              }

              private fun processQueue() {
                  if (isProcessingQueue) return
                  isProcessingQueue = true
                  stopBtn.visibility = View.VISIBLE

                  runningJob = lifecycleScope.launch {
                      try {
                          while (commandQueue.isNotEmpty()) {
                              val goal = commandQueue.removeFirst()
                              val apiKey = prefs.getString("api_key", "").orEmpty().trim()
                              val model = prefs.getString("model", "gemini-3.5-flash-lite").orEmpty().trim()
                              val maxSteps = prefs.getInt("max_steps", 40)

                              val runner = AgentRunner(
                                  context = this@MainActivity,
                                  apiKey = apiKey,
                                  model = model,
                                  maxSteps = maxSteps,
                                  onUpdate = { stepMsg ->
                                      runOnUiThread { addMessage(isUser = false, text = stepMsg) }
                                  }
                              )
                              val finalResult = runner.run(goal)
                              addMessage(isUser = false, text = finalResult)
                          }
                      } catch (_: CancellationException) {
                          addMessage(isUser = false, text = "⛔ اجرای دستور توسط شما متوقف شد.")
                      } finally {
                          isProcessingQueue = false
                          stopBtn.visibility = View.GONE
                          updateAccessibilityBanner()
                      }
                  }
              }

              private fun stopCurrentTask() {
                  commandQueue.clear()
                  runningJob?.cancel()
              }

              private fun addMessage(isUser: Boolean, text: String) {
                  messages.add(ChatMessage(System.nanoTime(), isUser, text))
                  saveChatHistory()
                  renderChat()
              }

              private fun deleteMessage(id: Long) {
                  messages.removeAll { it.id == id }
                  saveChatHistory()
                  renderChat()
              }

              private fun confirmClearChat() {
                  AlertDialog.Builder(this)
                      .setTitle("حذف کل چت")
                      .setMessage("همه پیام‌های چت پاک شوند؟")
                      .setPositiveButton("بله، پاک کن") { _, _ ->
                          messages.clear()
                          saveChatHistory()
                          renderChat()
                      }
                      .setNegativeButton("انصراف", null)
                      .show()
              }

              private fun renderChat() {
                  chatContainer.removeAllViews()
                  for (msg in messages) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = if (msg.isUser) Gravity.START else Gravity.END
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              topMargin = dp(4)
                              bottomMargin = dp(4)
                          }
                      }

                      val bubble = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          background = roundedBg(if (msg.isUser) "#2563EB" else "#1E293B", 14)
                          setPadding(dp(12), dp(8), dp(10), dp(8))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                      }

                      val tv = TextView(this).apply {
                          text = msg.text
                          setTextColor(Color.WHITE)
                          textSize = 13.5f
                          maxWidth = (resources.displayMetrics.widthPixels * 0.72).toInt()
                      }

                      val delBtn = TextView(this).apply {
                          text = " ✕ "
                          setTextColor(Color.parseColor("#CBD5E1"))
                          textSize = 13f
                          setPadding(dp(6), dp(2), dp(2), dp(2))
                          setOnClickListener { deleteMessage(msg.id) }
                      }

                      bubble.addView(tv)
                      bubble.addView(delBtn)
                      row.addView(bubble)
                      chatContainer.addView(row)
                  }
                  chatScroll.post { chatScroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun saveChatHistory() {
                  val arr = JSONArray()
                  for (m in messages.takeLast(120)) {
                      arr.put(
                          JSONObject()
                              .put("id", m.id)
                              .put("isUser", m.isUser)
                              .put("text", m.text)
                      )
                  }
                  prefs.edit().putString("chat_history", arr.toString()).apply()
              }

              private fun loadChatHistory() {
                  val raw = prefs.getString("chat_history", null) ?: return
                  try {
                      val arr = JSONArray(raw)
                      messages.clear()
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          messages.add(
                              ChatMessage(
                                  id = o.optLong("id", System.nanoTime() + i),
                                  isUser = o.optBoolean("isUser", false),
                                  text = o.optString("text", "")
                              )
                          )
                      }
                  } catch (_: Exception) {
                  }
              }
          }
