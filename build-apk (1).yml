                              createNewSession()
                              dialog.dismiss()
                          }
                      }
                      container.addView(newBtn)

                      val clearCurrentBtn = Button(this).apply {
                          text = "🗑️ پاک کردن پیام‌های صفحه فعلی"
                          isAllCaps = false
                          setTextColor(Color.parseColor("#FCA5A5"))
