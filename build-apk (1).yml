                      Color.parseColor("#5538BDF8"),
                      Color.TRANSPARENT,
                      Shader.TileMode.CLAMP
                  )
                  orb2Paint.shader = RadialGradient(
                      w * 0.88f, h * 0.42f, w * 0.70f,
                      Color.parseColor("#558B5CF6"),
                      Color.TRANSPARENT,
                      Shader.TileMode.CLAMP
                  )
                  orb3Paint.shader = RadialGradient(
