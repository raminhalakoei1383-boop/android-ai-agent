              private fun updateAccessibilityBanner() {
                  when (AccessibilityHelper.getState(this)) {
                      ServiceState.CONNECTED -> {
                          val batteryOk = AccessibilityHelper.isIgnoringBatteryOptimizations(this)
                          statusBanner.text = if (batteryOk) {
                              "🟢 دسترس‌پذیری فعال و محافظت‌شده در پس‌زمینه"
                          } else {
                              "🟢 دسترس‌پذیری فعال است (برای جلوگیری از قطع خودکار، باتری را بدون محدودیت کن)"
                          }
                          statusBanner.setTextColor(Color.parseColor("#86EFAC"))
                          if (batteryOk) {
                              statusActionBtn.visibility = View.GONE
                          } else {
                              statusActionBtn.text = "حفظ اتصال"
                              statusActionBtn.setOnClickListener { requestIgnoreBatteryOptimizations() }
                              statusActionBtn.visibility = View.VISIBLE
                          }
                      }
                      ServiceState.ENABLED_BUT_SUSPENDED -> {
                          statusBanner.text = "🟡 در تنظیمات روشن است ولی سیستم اتصالش را معلق کرده"
                          statusBanner.setTextColor(Color.parseColor("#FDE047"))
                          statusActionBtn.text = "اتصال مجدد"
                          statusActionBtn.setOnClickListener { openAccessibilitySettings() }
                          statusActionBtn.visibility = View.VISIBLE
                      }
                      ServiceState.DISABLED -> {
                          statusBanner.text = "🔴 سرویس دسترس‌پذیری خاموش است"
                          statusBanner.setTextColor(Color.parseColor("#FCA5A5"))
                          statusActionBtn.text = "روشن کردن"
                          statusActionBtn.setOnClickListener { openAccessibilitySettings() }
                          statusActionBtn.visibility = View.VISIBLE
                      }
                  }
              }

              private fun openAccessibilitySettings() {
                  try {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  } catch (_: Exception) {
                      Toast.makeText(this, "باز کردن تنظیمات دسترسی ناموفق بود", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun requestIgnoreBatteryOptimizations() {
                  try {
                      val intent = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS).apply {
                          data = Uri.parse("package:$packageName")
                      }
                      startActivity(intent)
                  } catch (_: Exception) {
                      openAppDetailsSettings()
                  }
              }

              private fun openAppDetailsSettings() {
                  try {
                      val intent = Intent(Settings.ACTION_APPLICATION_DETAILS_SETTINGS).apply {
                          data = Uri.fromParts("package", packageName, null)
                      }
                      startActivity(intent)
                  } catch (_: Exception) {
                  }
              }

              private fun createGlassDialog(title: String, contentBuilder: (LinearLayout, Dialog) -> Unit) {
                  val dialog = Dialog(this)
                  dialog.requestWindowFeature(Window.FEATURE_NO_TITLE)
                  dialog.window?.setBackgroundDrawable(ColorDrawable(Color.TRANSPARENT))

                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutDirection = View.LAYOUT_DIRECTION_RTL
                      background = GlassStyle.glassGradientPanel(
                          this@MainActivity, "#E6121A36", "#E61E1442", "#66FFFFFF", 24
                      )
                      setPadding(dp(18), dp(16), dp(18), dp(16))
                  }

                  val titleTv = TextView(this).apply {
                      text = title
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      setPadding(0, 0, 0, dp(10))
                  }
                  card.addView(titleTv)
                  contentBuilder(card, dialog)

                  val scroll = ScrollView(this).apply { addView(card) }
                  dialog.setContentView(scroll)
                  dialog.window?.setLayout(
                      (resources.displayMetrics.widthPixels * 0.92).toInt(),
                      ViewGroup.LayoutParams.WRAP_CONTENT
                  )
                  dialog.show()
              }

