                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), orb1Paint)
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), orb2Paint)
                  canvas.drawRect(0f, 0f, width.toFloat(), height.toFloat(), orb3Paint)
              }
          }

          object GlassStyle {
              fun dp(context: Context, v: Int): Int = (v * context.resources.displayMetrics.density).toInt()

              fun glassPanel(
                  context: Context,
                  fillHex: String = "#22FFFFFF",
                  strokeHex: String = "#48FFFFFF",
                  radiusDp: Int = 20,
                  strokeWidthDp: Int = 1
              ): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(fillHex))
                      cornerRadius = dp(context, radiusDp).toFloat()
                      setStroke(dp(context, strokeWidthDp).coerceAtLeast(1), Color.parseColor(strokeHex))
                  }
              }

              fun glassGradientPanel(
                  context: Context,
                  startHex: String,
                  endHex: String,
                  strokeHex: String,
                  radiusDp: Int = 20
              ): GradientDrawable {
                  return GradientDrawable(
                      GradientDrawable.Orientation.TL_BR,
                      intArrayOf(Color.parseColor(startHex), Color.parseColor(endHex))
                  ).apply {
                      cornerRadius = dp(context, radiusDp).toFloat()
                      setStroke(dp(context, 1).coerceAtLeast(1), Color.parseColor(strokeHex))
                  }
              }
          }
