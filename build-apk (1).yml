              private fun onSendClicked() {
                  val cmd = inputBox.text.toString().trim()
                  if (cmd.isEmpty()) return

                  val apiKey = prefs.getString("api_key", "").orEmpty().trim()
                  if (apiKey.isEmpty()) {
                      Toast.makeText(this, "ابتدا از بخش تنظیمات، کلید Gemini API را وارد کن", Toast.LENGTH_LONG).show()
                      showSettingsDialog()
                      return
                  }

                  inputBox.setText("")
                  val session = currentSession()
                  if (session.messages.isEmpty() || session.title == "صفحه جدید") {
                      session.title = cmd.take(28)
                  }
                  addMessage(isUser = true, text = cmd)
                  commandQueue.addLast(cmd)

                  if (isProcessingQueue) {
                      addMessage(isUser = false, text = "⏳ در صف قرار گرفت؛ بلافاصله بعد از کار فعلی اجرا می‌شود.")
                  } else {
                      processQueue()
                  }
              }

              private fun processQueue() {
                  if (isProcessingQueue) return
                  isProcessingQueue = true
                  stopBtn.visibility = View.VISIBLE

                  runningJob = lifecycleScope.launch {
                      try {
                          while (commandQueue.isNotEmpty()) {
                              val goal = commandQueue.removeFirst()
                              val apiKey = prefs.getString("api_key", "").orEmpty().trim()
                              val model = prefs.getString("model", DEFAULT_MODEL).orEmpty().trim().ifEmpty { DEFAULT_MODEL }
                              val maxSteps = prefs.getInt("max_steps", 40)

                              runOnUiThread {
                                  liveStatusTv.text = "🚀 شروع اجرای دستور با $model..."
                                  liveStatusTv.visibility = View.VISIBLE
                              }
                              val runner = AgentRunner(
                                  context = this@MainActivity,
                                  apiKey = apiKey,
                                  model = model,
                                  maxSteps = maxSteps,
                                  onUpdate = { stepMsg ->
                                      runOnUiThread { addMessage(isUser = false, text = stepMsg) }
                                  },
                                  onLiveStatus = { statusText ->
                                      runOnUiThread {
                                          liveStatusTv.text = statusText
                                          liveStatusTv.visibility = View.VISIBLE
                                      }
                                  }
                              )
                              val finalResult = runner.run(goal)
                              addMessage(isUser = false, text = finalResult)
                          }
                      } catch (_: CancellationException) {
                          addMessage(isUser = false, text = "⛔ اجرای دستور متوقف شد.")
                      } finally {
                          isProcessingQueue = false
                          stopBtn.visibility = View.GONE
                          liveStatusTv.visibility = View.GONE
                          updateAccessibilityBanner()
                      }
                  }
              }

              private fun stopCurrentTask() {
                  commandQueue.clear()
                  runningJob?.cancel()
              }

              private fun addMessage(isUser: Boolean, text: String) {
                  currentSession().messages.add(ChatMessage(System.nanoTime(), isUser, text))
                  saveSessions()
                  renderChat()
              }

              private fun deleteMessage(id: Long) {
                  currentSession().messages.removeAll { it.id == id }
                  saveSessions()
                  renderChat()
              }

              private fun renderChat() {
                  chatContainer.removeAllViews()
                  val msgs = currentSession().messages
                  if (msgs.isEmpty()) {
                      val emptyCard = TextView(this).apply {
                          text = "✨ آماده اجرای دقیق دستورات با Gemini 4 Hydrogen\n\nدستور کاملت را پایین بنویس تا مرحله‌به‌مرحله و واقعی روی گوشی انجام شود."
                          setTextColor(Color.parseColor("#E2E8F0"))
                          textSize = 13.5f
                          gravity = Gravity.CENTER
                          background = GlassStyle.glassPanel(this@MainActivity, "#1EFFFFFF", "#3BFFFFFF", 20)
                          setPadding(dp(18), dp(20), dp(18), dp(20))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = dp(24) }
                      }
                      chatContainer.addView(emptyCard)
                      return
                  }

                  for (msg in msgs) {
                      val row = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = if (msg.isUser) Gravity.START else Gravity.END
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply {
                              topMargin = dp(5)
                              bottomMargin = dp(5)
                          }
                      }

                      val bubble = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          background = if (msg.isUser) {
                              GlassStyle.glassGradientPanel(
                                  this@MainActivity, "#5538BDF8", "#556366F1", "#88A5F3FC", 18
                              )
                          } else {
                              GlassStyle.glassGradientPanel(
                                  this@MainActivity, "#2EFFFFFF", "#1A1E293B", "#4DFFFFFF", 18
                              )
                          }
                          setPadding(dp(12), dp(9), dp(12), dp(7))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          )
                      }

                      val tv = TextView(this).apply {
                          text = msg.text
                          setTextColor(Color.WHITE)
                          textSize = 13.5f
                          setTextIsSelectable(true)
                          maxWidth = (resources.displayMetrics.widthPixels * 0.78).toInt()
                      }

                      val actionsRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.END
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.MATCH_PARENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply { topMargin = dp(6) }
                      }

                      val copyBtn = TextView(this).apply {
                          text = "کپی"
                          setTextColor(Color.parseColor("#BAE6FD"))
                          textSize = 11f
                          background = GlassStyle.glassPanel(this@MainActivity, "#22FFFFFF", "#40FFFFFF", 8)
                          setPadding(dp(8), dp(2), dp(8), dp(2))
                          setOnClickListener { copyToClipboard(msg.text) }
                      }

                      val delBtn = TextView(this).apply {
                          text = "حذف ✕"
                          setTextColor(Color.parseColor("#FCA5A5"))
                          textSize = 11f
                          background = GlassStyle.glassPanel(this@MainActivity, "#22EF4444", "#44FCA5A5", 8)
                          setPadding(dp(8), dp(2), dp(8), dp(2))
                          layoutParams = LinearLayout.LayoutParams(
                              ViewGroup.LayoutParams.WRAP_CONTENT,
                              ViewGroup.LayoutParams.WRAP_CONTENT
                          ).apply { marginStart = dp(6) }
                          setOnClickListener { deleteMessage(msg.id) }
                      }

                      actionsRow.addView(copyBtn)
                      actionsRow.addView(delBtn)

                      bubble.addView(tv)
                      bubble.addView(actionsRow)
                      row.addView(bubble)
                      chatContainer.addView(row)
                  }
                  chatScroll.post { chatScroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun saveSessions() {
                  val arr = JSONArray()
                  for (s in sessions.take(30)) {
                      val mArr = JSONArray()
                      for (m in s.messages.takeLast(120)) {
                          mArr.put(
                              JSONObject()
                                  .put("id", m.id)
                                  .put("isUser", m.isUser)
                                  .put("text", m.text)
                          )
                      }
                      arr.put(
                          JSONObject()
                              .put("id", s.id)
                              .put("title", s.title)
                              .put("messages", mArr)
                      )
                  }
                  prefs.edit()
                      .putString("sessions_json", arr.toString())
                      .putString("current_session_id", currentSessionId)
                      .apply()
              }

              private fun loadSessions() {
                  val raw = prefs.getString("sessions_json", null)
                  currentSessionId = prefs.getString("current_session_id", "").orEmpty()
                  sessions.clear()
                  if (!raw.isNullOrBlank()) {
                      try {
                          val arr = JSONArray(raw)
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              val msgs = mutableListOf<ChatMessage>()
                              val mArr = o.optJSONArray("messages")
                              if (mArr != null) {
                                  for (j in 0 until mArr.length()) {
                                      val mo = mArr.getJSONObject(j)
                                      msgs.add(
                                          ChatMessage(
                                              id = mo.optLong("id", System.nanoTime() + j),
                                              isUser = mo.optBoolean("isUser", false),
                                              text = mo.optString("text", "")
                                          )
                                      )
                                  }
                              }
                              sessions.add(
                                  ChatSession(
                                      id = o.optString("id", "chat_$i"),
                                      title = o.optString("title", "صفحه گفتگو"),
                                      messages = msgs
                                  )
                              )
                          }
                      } catch (_: Exception) {
                      }
                  }
                  if (sessions.isEmpty()) {
                      val initial = ChatSession("chat_${System.currentTimeMillis()}", "صفحه جدید", mutableListOf())
                      sessions.add(initial)
                      currentSessionId = initial.id
                  }
              }
          }
          ''')

          print("Generated Android AI Agent v2.1 successfully.")
