          ''')

          write(os.path.join(RES_DIR, "xml/accessibility_service_config.xml"), r'''
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:canTakeScreenshot="true"
              android:description="@string/accessibility_service_description"
              android:notificationTimeout="100" />
          ''')

          write(os.path.join(RES_DIR, "values/strings.xml"), r'''
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Android AI Agent</string>
              <string name="accessibility_service_description">اجازه به ایجنت هوشمند (Gemini 4 Hydrogen) برای خواندن صفحه، باز کردن برنامه‌ها، لمس دکمه‌ها و اجرای دقیق دستورات شما.</string>
          </resources>
          ''')

          write(os.path.join(PKG_DIR, "KeepAliveService.kt"), r'''
          package com.aiagent.android

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import androidx.core.app.NotificationCompat

          class KeepAliveService : Service() {

              companion object {
                  private const val CHANNEL_ID = "agent_keep_alive_channel"
                  private const val NOTIF_ID = 2048

                  fun start(context: Context) {
                      try {
                          val intent = Intent(context, KeepAliveService::class.java)
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              context.startForegroundService(intent)
                          } else {
                              context.startService(intent)
                          }
                      } catch (_: Exception) {
                      }
                  }

                  fun stop(context: Context) {
                      try {
                          context.stopService(Intent(context, KeepAliveService::class.java))
                      } catch (_: Exception) {
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  startInForeground()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startInForeground()
                  return START_STICKY
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val nm = getSystemService(NotificationManager::class.java)
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "حفظ اتصال ایجنت هوشمند",
                          NotificationManager.IMPORTANCE_LOW
                      ).apply {
                          description = "برای جلوگیری از قطع خودکار سرویس دسترس‌پذیری در پس‌زمینه"
                          setShowBadge(false)
                      }
                      nm?.createNotificationChannel(channel)
                  }
              }

              private fun startInForeground() {
                  try {
                      val openIntent = Intent(this, MainActivity::class.java).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP
                      }
                      val pendingFlags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      } else {
                          PendingIntent.FLAG_UPDATE_CURRENT
                      }
                      val pi = PendingIntent.getActivity(this, 0, openIntent, pendingFlags)
                      val notif: Notification = NotificationCompat.Builder(this, CHANNEL_ID)
                          .setSmallIcon(android.R.drawable.ic_menu_compass)
                          .setContentTitle("ایجنت هوشمند فعال است")
                          .setContentText("سرویس دسترس‌پذیری متصل و آماده اجرای دستورات است")
                          .setOngoing(true)
                          .setSilent(true)
                          .setPriority(NotificationCompat.PRIORITY_LOW)
                          .setContentIntent(pi)
                          .build()

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                          startForeground(NOTIF_ID, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                      } else {
                          startForeground(NOTIF_ID, notif)
                      }
                  } catch (_: Exception) {
                  }
              }
          }
          ''')

          write(os.path.join(PKG_DIR, "AccessibilityHelper.kt"), r'''
          package com.aiagent.android

          import android.accessibilityservice.AccessibilityServiceInfo
          import android.content.ComponentName
          import android.content.Context
          import android.os.PowerManager
          import android.provider.Settings
          import android.view.accessibility.AccessibilityManager

          enum class ServiceState {
              CONNECTED,
              ENABLED_BUT_SUSPENDED,
              DISABLED
          }

          object AccessibilityHelper {

              fun isConnected(): Boolean = AgentAccessibilityService.instance != null

              fun isIgnoringBatteryOptimizations(context: Context): Boolean {
                  return try {
                      val pm = context.getSystemService(Context.POWER_SERVICE) as? PowerManager
                      pm?.isIgnoringBatteryOptimizations(context.packageName) == true
                  } catch (_: Exception) {
                      false
                  }
              }

              fun isEnabledInSettings(context: Context): Boolean {
                  if (isConnected()) return true

                  val myPkg = context.packageName
                  val myCls = AgentAccessibilityService::class.java.name
                  val myShortCls = AgentAccessibilityService::class.java.simpleName

                  try {
                      val am = context.getSystemService(Context.ACCESSIBILITY_SERVICE) as? AccessibilityManager
                      val enabledList = am?.getEnabledAccessibilityServiceList(AccessibilityServiceInfo.FEEDBACK_ALL_MASK)
                      if (enabledList != null) {
                          for (info in enabledList) {
                              val si = info.resolveInfo?.serviceInfo ?: continue
                              if (si.packageName == myPkg &&
                                  (si.name == myCls || si.name.endsWith(".$myShortCls") || si.name == myShortCls)
                              ) {
                                  return true
                              }
                          }
                      }
                  } catch (_: Exception) {
                  }

                  try {
                      val raw = Settings.Secure.getString(
                          context.contentResolver,
                          Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                      ) ?: ""
                      val expected = ComponentName(myPkg, myCls)
                      for (entry in raw.split(':')) {
                          val trimmed = entry.trim()
                          if (trimmed.isEmpty()) continue
                          val parsed = ComponentName.unflattenFromString(trimmed)
                          if (parsed != null && parsed == expected) return true
                          if (trimmed.contains(myPkg) && trimmed.contains(myShortCls)) return true
                      }
                  } catch (_: Exception) {
                  }

                  return false
              }

              fun getState(context: Context): ServiceState {
                  if (isConnected()) return ServiceState.CONNECTED
                  if (isEnabledInSettings(context)) return ServiceState.ENABLED_BUT_SUSPENDED
                  return ServiceState.DISABLED
              }
          }
          ''')

          write(os.path.join(PKG_DIR, "AgentAccessibilityService.kt"), r'''
          package com.aiagent.android

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Path
          import android.graphics.Rect
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.util.Base64
          import android.view.Display
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.suspendCancellableCoroutine
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.CopyOnWriteArraySet
          import kotlin.coroutines.resume

          data class UiElement(
              val index: Int,
              val text: String,
              val desc: String,
              val viewId: String,
              val className: String,
              val clickable: Boolean,
              val editable: Boolean,
              val scrollable: Boolean,
              val bounds: Rect
