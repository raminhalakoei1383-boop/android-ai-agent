name: Build Android APK v2.1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android AI Agent v2.1 (Glass + Gemini 4 Hydrogen + Schema/LowThinking)
        run: |
          python3 - << 'PYEOF'
          import os
          import textwrap

          ROOT = "AndroidAIAgentApp"
          PKG_DIR = os.path.join(ROOT, "app/src/main/java/com/aiagent/android")
          RES_DIR = os.path.join(ROOT, "app/src/main/res")

          def write(path, content):
              os.makedirs(os.path.dirname(path), exist_ok=True)
              with open(path, "w", encoding="utf-8") as f:
                  f.write(textwrap.dedent(content).lstrip("\n"))

          write(os.path.join(ROOT, "settings.gradle.kts"), r'''
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AndroidAIAgent"
          include(":app")
          ''')

          write(os.path.join(ROOT, "build.gradle.kts"), r'''
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ''')

          write(os.path.join(ROOT, "gradle.properties"), r'''
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style.official
          android.nonTransitiveRClass=true
          ''')
          write(os.path.join(ROOT, "app/build.gradle.kts"), r'''
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.aiagent.android"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.aiagent.android"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 21
                  versionName = "2.1"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("release.keystore")
                      storePassword = "agentpass123"
                      keyAlias = "agentkey"
                      keyPassword = "agentpass123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.4")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          ''')

          write(os.path.join(ROOT, "app/src/main/AndroidManifest.xml"), r'''
