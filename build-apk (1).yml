                                      createNewSession()
                                  } else if (currentSessionId == s.id) {
                                      currentSessionId = sessions.first().id
                                  }
                                  saveSessions()
                                  renderChat()
                                  dialog.dismiss()
                              }
                          }

                          row.addView(titleTv)
                          row.addView(delTv)
                          container.addView(row)
                      }
                  }
              }

              private fun createNewSession() {
                  val created = ChatSession("chat_${System.currentTimeMillis()}", "صفحه جدید", mutableListOf())
                  sessions.add(0, created)
                  currentSessionId = created.id
                  saveSessions()
                  renderChat()
                  Toast.makeText(this, "صفحه گفتگوی جدید باز شد", Toast.LENGTH_SHORT).show()
              }

              private fun copyToClipboard(text: String) {
                  try {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("agent_message", text))
                      Toast.makeText(this, "پیام کپی شد", Toast.LENGTH_SHORT).show()
                  } catch (_: Exception) {
                  }
